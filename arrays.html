<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Burrow Hill Arrays</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* layout: one column, a trail of four stops on top, one stage card below */
:root{--sky:#FFC83D;--sun:#FFD96B;--plum:#2B1B4A;--plum2:#45306E;--coral:#FF6B5E;--coralD:#E24A3E;--teal:#12A594;--mint:#9BE8D0;--cream:#FFF6E0;--meadow:#8FDDBD;
  --display:"Outfit",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--sky);color:var(--plum);font-family:var(--display);font-size:17px;line-height:1.45}
.wrap{max-width:min(1560px,94vw);margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-bottom:18px}
h1{font-size:34px;font-weight:800;letter-spacing:-1px;margin:0;line-height:1}
.sub{font-family:var(--mono);font-size:12px;letter-spacing:3px;font-weight:700}
.xp{margin-left:auto;font-family:var(--mono);font-weight:700;background:var(--plum);color:var(--cream);padding:8px 16px;border-radius:999px;font-variant-numeric:tabular-nums}
.trail{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
.stop{font:inherit;text-align:left;border:4px solid var(--plum);background:var(--cream);color:var(--plum);border-radius:16px;padding:10px 14px;cursor:pointer;box-shadow:4px 5px 0 var(--plum);min-width:0}
.stop small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:2px;font-weight:700}
.stop b{display:block;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop[aria-current="true"]{background:var(--coral)}
.stop.done{background:var(--mint)}
.stop[aria-current="true"],.stop.done[aria-current="true"]{background:var(--coral)}
.stop:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.stop:focus-visible,button:focus-visible,textarea:focus-visible{outline:4px solid var(--teal);outline-offset:2px}
.card{background:var(--cream);border:5px solid var(--plum);border-radius:22px;box-shadow:8px 10px 0 var(--plum);padding:20px;margin-bottom:22px}
h2{font-size:28px;font-weight:800;letter-spacing:-.5px;margin:0 0 6px;text-wrap:balance}
p{margin:0 0 12px;max-width:68ch}
.vid{position:relative;border:5px solid var(--plum);border-radius:16px;overflow:hidden;background:var(--plum);width:min(100%,calc(76vh * 16 / 9));margin-inline:auto}
.vid video{display:block;width:100%;height:auto;aspect-ratio:16/9}
.cap{text-align:center;font-family:var(--mono);font-size:15px;min-height:46px;padding:10px 4px 0;font-weight:500}
.quiz{position:absolute;inset:0;background:rgba(43,27,74,.88);display:flex;align-items:center;justify-content:center;padding:16px}
.quiz .q{background:var(--cream);border:5px solid var(--plum);border-radius:18px;padding:18px 20px;max-width:560px;width:100%;box-shadow:6px 8px 0 var(--coral);max-height:100%;overflow:auto}
.quiz h3{margin:0 0 4px;font-size:13px;font-family:var(--mono);letter-spacing:3px}
.quiz .ask{font-weight:700;font-size:20px;margin-bottom:12px}
.opts{display:grid;gap:8px}
button{font:inherit;cursor:pointer}
.opt,.btn{border:4px solid var(--plum);background:var(--cream);color:var(--plum);border-radius:12px;padding:9px 14px;font-weight:700;text-align:left}
.opt.right{background:var(--mint)} .opt.wrong{background:var(--coral);animation:shake .3s}
.btn{background:var(--sky);box-shadow:3px 4px 0 var(--plum);text-align:center}
.btn.go{background:var(--coral)} .btn.quiet{background:var(--cream);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.why{margin-top:10px;font-size:15px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}.trail{grid-template-columns:repeat(2,minmax(0,1fr))}}
textarea{width:100%;min-height:270px;font-family:var(--mono);font-size:14.500px;line-height:1.5;background:var(--plum);color:var(--cream);border:5px solid var(--plum);border-radius:14px;padding:14px;resize:vertical;tab-size:2}
pre,code{font-family:var(--mono);font-size:14px}
.spec{background:var(--sky);border:4px solid var(--plum);border-radius:12px;padding:10px 14px;font-family:var(--mono);font-size:14px;overflow-x:auto;margin:0 0 12px}
.tests{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px;font-family:var(--mono);font-size:13.500px}
.tests li{border:3px solid var(--plum);border-radius:10px;padding:6px 10px;overflow-wrap:anywhere}
.tests .ok{background:var(--mint)} .tests .bad{background:#FFC2BB}
.note{border-left:6px solid var(--teal);padding:6px 12px;background:#fff;border-radius:0 10px 10px 0;margin-top:10px;font-size:15px}
.note.warn{border-color:var(--coralD)}
.plan{background:#fff;border:4px solid var(--plum);border-radius:12px;padding:12px 16px;margin:0 0 14px;font-size:15.500px}
.plan b{display:block;font-size:17px;margin-bottom:4px}
.plan ol{margin:0 0 8px;padding-left:20px}
.plan li{margin-bottom:5px}
.plan span{font-family:var(--mono);font-size:12.500px;font-weight:700}
.vctl{display:flex;align-items:center;justify-content:center;margin-top:8px;font-family:var(--mono);font-weight:700;font-size:12.500px}
.vctl span{margin-right:10px;letter-spacing:2px;text-transform:uppercase}
.vctl button{font-family:var(--display);font-weight:700;font-size:14px;color:var(--plum);background:var(--cream);border:3px solid var(--plum);margin-left:-3px;padding:6px 16px;white-space:nowrap;min-height:38px}
.vctl button:first-of-type{border-radius:10px 0 0 10px;margin-left:0}
.vctl button:last-of-type{border-radius:0 10px 10px 0}
.vctl button:active{background:var(--sky)}
.stop .short,.stop .num{display:none}
.hint{background:var(--mint);border:3px solid var(--plum);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:15px}
/* walkthrough stage */
.stage{position:relative;height:250px;background:var(--sky);border:4px solid var(--plum);border-radius:14px;overflow:hidden;margin-top:12px}
.stage.meadow{background:var(--meadow)}
.stage-in{position:absolute;left:50%;top:0;height:100%;transform-origin:50% 0}
.cellx{position:absolute;top:130px;width:74px;height:74px;border:4px solid var(--plum);background:var(--plum);border-radius:37px 37px 0 0}
.ixx{position:absolute;top:210px;width:74px;text-align:center;font-family:var(--mono);font-weight:700;font-size:15px}
.valx{position:absolute;top:156px;width:46px;height:42px;line-height:34px;text-align:center;font-weight:800;font-size:20px;background:var(--cream);border:4px solid var(--plum);border-radius:8px;transition:left .45s cubic-bezier(.5,1.6,.5,1),top .45s}
.valx.hot{background:var(--coral)}
.ptr{position:absolute;top:44px;width:74px;text-align:center;transition:left .45s cubic-bezier(.5,1.4,.5,1)}
.ptr svg{display:block;margin:0 auto}
.ptr span,.tag{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:700;background:var(--plum);color:var(--cream);border-radius:999px;padding:2px 9px}
.tag{position:absolute;transition:left .4s,top .4s,opacity .2s}
.codeview{background:var(--plum);color:var(--cream);border-radius:14px;padding:12px 0;margin:12px 0 0;overflow-x:auto}
.codeview div{padding:0 14px;white-space:pre;font-family:var(--mono);font-size:13.500px;line-height:1.6}
.codeview .on{background:var(--coral);color:var(--plum);font-weight:700}
.say{font-weight:700;min-height:50px;margin-top:10px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.sum div{border:4px solid var(--plum);border-radius:12px;padding:10px 12px;background:#fff}
.sum b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.keys{margin-top:16px;border-top:4px solid var(--plum);padding-top:14px}
.keys h3{margin:0 0 8px;font-size:20px;font-weight:800}
.keys ul{margin:0 0 10px;padding-left:20px;max-width:70ch}
.keys li{margin-bottom:6px}
.keys table{border-collapse:collapse;font-family:var(--mono);font-size:14px;margin-top:6px}
.keys td{border:3px solid var(--plum);padding:6px 12px;background:#fff}
.keys td:first-child{font-weight:700;background:var(--mint)}
.keys td.slow{background:#FFC2BB}
.mine{background:var(--plum);color:var(--cream);border-radius:14px;padding:12px 14px;white-space:pre-wrap;overflow-x:auto;font-family:var(--mono);font-size:13.500px;line-height:1.6;margin:0}
/* phones: compact header, a slim five-step bar, clean video, questions under the video */
@media(max-width:700px){
  body{font-size:16px}
  .wrap{padding-block:12px 36px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  header{gap:4px 12px;margin-bottom:10px}
  h1{font-size:24px}
  .sub{font-size:10.500px;letter-spacing:2px}
  header nav{order:3;width:100%;margin-left:0!important;font-size:12px!important;gap:4px 14px!important}
  .xp{margin-left:auto!important;padding:5px 12px;font-size:13px}
  .trail{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-bottom:12px}
  .stop{padding:7px 2px 6px;border-width:3px;border-radius:10px;box-shadow:none;text-align:center}
  .stop b,.stop .full{display:none}
  .stop .short{display:block;font-size:10.500px;letter-spacing:0;white-space:nowrap}
  .stop .num{display:block;font-family:var(--display);font-weight:800;font-size:17px;line-height:1.1}
  .card{padding:12px;border-width:4px;border-radius:16px;box-shadow:4px 5px 0 var(--plum);margin-bottom:16px}
  h2{font-size:21px;margin-bottom:4px}
  p{font-size:15.500px;margin-bottom:10px}
  .vid{border-width:3px;border-radius:10px}
  .cap{font-size:13px;line-height:1.4;min-height:40px;padding:8px 2px 0;letter-spacing:0}
  .spec{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
  textarea{min-height:220px;font-size:13.500px;border-width:4px}
  .row .btn{padding:9px 14px}
  .quiz.below{position:static;background:none;padding:10px 0 0}
  .quiz.below .q{max-width:none;max-height:none;box-shadow:4px 5px 0 var(--coral);padding:14px}
  .quiz .ask{font-size:17px}
  .say{min-height:0}
  .plan{padding:10px 12px;font-size:14.500px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div class="wrap">
<header>
  <div><div class="sub">CHAPTER 1 · ARRAYS</div><h1><a href="index.html" title="Back to the home page" style="color:inherit;text-decoration:none">Burrow Hill</a></h1></div>
  <nav style="margin-left:auto;display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-weight:700;font-size:13px"><a href="index.html" style="color:var(--plum)">Home</a><a href="index.html#chapters" style="color:var(--plum)">All chapters</a><a href="chapter.html?c=strings" style="color:var(--plum)">Chapter 2: Strings →</a></nav>
  <div class="xp" id="xp" aria-live="polite" style="margin-left:0">0 XP</div>
</header>
<nav class="trail" id="trail" aria-label="Stages"></nav>
<main id="main"></main>
</div>
<script src="data.js"></script>
<script>
"use strict";
const D = window.BURROW || { videos: {} };
const $ = (s, el = document) => el.querySelector(s);
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- saved progress (this browser only) ----------
const KEY = 'burrow-arrays-v2';
let S = { xp: 0, done: {}, quiz: {}, code: {}, hints: {}, runs: {}, solvedAt: {}, seen: {}, at: 'w', feel: null, why: '' };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} $('#xp').textContent = S.xp + ' XP'; };
const gain = (n) => { S.xp += n; save(); };

const STAGES = [
  { id: 'w', kind: 'lesson', video: 'intro', label: 'Introduction', name: 'Meet Pip and Moss', intro: 'Two minutes of setup: who the characters are and how each lesson runs.' },
  { id: 't1', kind: 'lesson', video: 't1', label: 'Theory 1', name: 'What an array is', intro: 'The video stops twice and asks you to guess. Guess before it shows you; that is where the learning happens.' },
  { id: 't2', kind: 'lesson', video: 't2', label: 'Theory 2', name: 'What it costs', intro: 'Three guesses this time. Each one is about how many parcels have to move.' },
  { id: 'p1', kind: 'puzzle', video: 'p1', label: 'Puzzle', name: 'The Backwards Parade' },
  { id: 's1', kind: 'solution', video: 's1', label: 'Solution', name: 'Line by line' },
];
const unlocked = (i) => i === 0 || S.done[STAGES[i - 1].id] || (STAGES[i].id === 's1' && S.seen['sol-p1']);

const NOTES = {
  t1: `<h3>Key ideas</h3><ul>
    <li><b>An array is one unbroken stretch of memory</b>, cut into slots of the same width.</li>
    <li><b>The index is a distance</b>: how many slots you are from the start. The first slot is 0 slots away, so indexes start at 0. The last index is <code>row.length - 1</code>.</li>
    <li><b>Reading or writing by index is one step</b>: address = start + index × width. The size of the array does not matter. That is O(1).</li>
    <li><b>Visiting every slot takes n steps</b>: <code>for (let i = 0; i &lt; row.length; i++)</code>. That is O(n).</li></ul>`,
  t2: `<h3>Key ideas</h3><ul>
    <li><b>No gaps, no spreading</b>: to insert in the middle, everything after it shifts right. To remove from the middle, everything after it shifts left.</li>
    <li><b>The end is cheap</b>: adding there moves nobody.</li>
    <li><b>Fixed size</b>: when the row is full, everything is copied to a longer stretch of memory. JavaScript does this for you, but it still costs time.</li></ul>
    <table><tr><td>O(1)</td><td>read or write by index</td></tr><tr><td>O(1)</td><td>add at the end</td></tr><tr><td class="slow">O(n)</td><td>insert or remove in the middle</td></tr><tr><td class="slow">O(n)</td><td>visit every slot</td></tr></table>
    <p style="margin-top:10px">Use an array when you read by position a lot. Avoid it when you insert in the middle a lot.</p>`,
};

const QUIZ = {
  'arr-q1': { ask: 'Pip found door 5 with one sum. Door 700 is much further along. How many steps does he need?',
    opts: ['700 steps', 'About 350 steps', '1 step', 'It depends on how long the row is'], right: 2,
    why: 'start + 700 × width is still one sum, then one jump. The distance does not matter.' },
  'arr-q2': { ask: 'Doors 0 to 6 each hold a parcel. A new parcel must go into door 2. How many parcels have to move?',
    opts: ['0', '1', '5', '7'], right: 2, why: 'The parcels in doors 2, 3, 4, 5 and 6 each shift one place to the right. That is 5 moves.' },
  't1-q1': { ask: 'A row has 8 doors. What is the index of the last door?', opts: ['8', '7', '9', '1'], right: 1,
    why: 'Indexes count the distance from the start, beginning at 0. Eight doors use indexes 0 to 7.' },
  't1-q2': { ask: 'Pip found door 5 with one sum. Door 700 is much further along. How many steps does he need?',
    opts: ['700 steps', 'About 350 steps', '1 step', 'It depends on how long the row is'], right: 2,
    why: 'start + 700 × width is still one sum, then one jump. The distance does not matter.' },
  't2-q1': { ask: 'Doors 0 to 6 each hold a parcel. A new parcel must go into door 2. How many parcels have to move?',
    opts: ['0', '1', '5', '7'], right: 2, why: 'The parcels in doors 2, 3, 4, 5 and 6 each shift one place to the right. That is 5 moves.' },
  't2-q2': { ask: 'All 8 doors are full. The parcel in door 1 is taken out. How many parcels must shift left to close the gap?',
    opts: ['1', '6', '7', '0'], right: 1, why: 'Everything after door 1 moves: the parcels in doors 2 to 7. That is 6 moves.' },
  't2-q3': { ask: 'A new parcel is added at the end of the row, in the empty last door. How many parcels move?',
    opts: ['All of them', 'Half of them', 'One', 'None'], right: 3, why: 'Nothing stands after the last door, so nothing has to shift.' },
  's1-q1': { ask: 'left = 2 and right = 2. The loop test is left < right. Does the loop run again?',
    opts: ['Yes, it swaps the middle parcel with itself', 'No, 2 is not less than 2, so it stops'], right: 1,
    why: '2 < 2 is false. The middle parcel is already where it belongs.' },
  'list-q1': { ask: 'Stones have no door numbers. How does Moss reach the 4th stone?',
    opts: ['He jumps straight to it, like Pip', 'He starts at the head and follows each signpost', 'He starts at null and walks backwards'], right: 1,
    why: 'A stone only knows the next stone. The only way in is from the head, one signpost at a time.' },
  'list-q2': { ask: 'A new stone goes between stone 2 and stone 3. How many of the old stones must move?',
    opts: ['None', 'Two', 'Every stone after it'], right: 0, why: 'The stones stay where they are. Only signposts change.' },
};

const PUZZLE = {
  p1: { fn: 'reverse', title: 'The Backwards Parade',
    plan: ['Say the goal in your own words: the first parcel ends up last, and the last ends up first.',
      'Do it by hand on [1, 2, 3, 4, 5]. Which two parcels trade places first? Which two next?',
      'You may only use the row itself. What is the least you have to keep track of while you work?',
      'When are you finished? Check a row with five parcels and a row with four.'],
    ask: 'Reverse the row <b>in place</b>. Change the array you are given; do not build a second one.',
    spec: 'reverse([1, 2, 3, 4, 5])  →  the same array is now [5, 4, 3, 2, 1]',
    start: '// row is an array of numbers, for example [1, 2, 3, 4, 5].\n// Reverse it in place. No second array.\nfunction reverse(row) {\n  // your code here\n}\n',
    tests: [[1, 2, 3, 4, 5], [1, 2], [7], [], [3, 1, 4, 1, 5, 9]],
    hints: ['Pip stands on door 0 and Moss on the last door. What could the two of them exchange?',
      'After one swap, both take a step toward the middle. Then they swap again.',
      'They stop when they meet or pass each other: keep going while left < right.'] },
  p2: { fn: 'reverse', title: 'Turn the Trail Around',
    ask: 'Turn every signpost around and <b>return the new head</b>. Reuse the stones you are given; do not make new ones.',
    spec: '1 → 2 → 3 → 4 → null   becomes   4 → 3 → 2 → 1 → null',
    start: '// A stone looks like { value: 3, next: <another stone, or null> }.\n// head is the first stone, or null when the trail is empty.\nfunction reverse(head) {\n  // your code here\n}\n',
    tests: [[1, 2, 3, 4], [1, 2], [5], []],
    hints: ['Walk the trail one stone at a time. At each stone, turn one signpost so it points to the stone behind you.',
      'Before you turn a signpost, save where it pointed in a variable. If you skip that, the rest of the trail is lost.',
      'Use three names: prev (starts as null), curr (starts as head) and next. After each turn, move prev and curr one stone forward. At the end, prev is the new head.'] },
};
const SOLUTION = {
  p1: ['function reverse(row) {', '  let left = 0;', '  let right = row.length - 1;', '  while (left < right) {', '    [row[left], row[right]] = [row[right], row[left]];', '    left++;', '    right--;', '  }', '}'],
  p2: ['function reverse(head) {', '  let prev = null;', '  let curr = head;', '  while (curr !== null) {', '    const next = curr.next;   // save the rest of the trail', '    curr.next = prev;         // turn the signpost', '    prev = curr;              // step forward', '    curr = next;', '  }', '  return prev;', '}'],
};

// ---------- trail ----------
function drawTrail() {
  const t = $('#trail'); t.innerHTML = '';
  STAGES.forEach((st, i) => {
    const b = h(`<button class="stop ${S.done[st.id] ? 'done' : ''}" ${unlocked(i) ? '' : 'disabled'} aria-current="${S.at === st.id}"><span class="num">${S.done[st.id] ? '✓' : i + 1}</span><small><span class="full">${st.label}${S.done[st.id] ? ' · DONE' : ''}</span><span class="short">${st.label.replace('Introduction', 'Intro').replace('Welcome', 'Intro')}</span></small><b>${st.name}</b></button>`);
    b.onclick = () => go(st.id); t.append(b);
  });

}
function go(id) { S.at = id; save(); drawTrail(); const st = STAGES.find((s) => s.id === id) || STAGES[0]; ({ lesson, puzzle, solution })[st.kind](st); window.scrollTo({ top: 0 }); }
function nextBtn(st) {
  const i = STAGES.indexOf(st), nx = STAGES[i + 1];
  const b = h(`<button class="btn go">${nx ? 'Next: ' + nx.label + ' →' : 'See how it went →'}</button>`);
  b.onclick = () => (nx ? go(nx.id) : finish()); return b;
}

// ---------- video with predict-the-next-step pauses ----------
function player(vkey, onEnd) {
  const V = D.videos[vkey]; const box = h(`<div><div class="vid"><video controls playsinline preload="metadata" src="${V ? V.src : ''}"></video></div><div class="vctl" role="group" aria-label="Replay"><span>Replay</span><button data-a="back" title="Go back 10 seconds">10 s</button><button data-a="line" title="Replay this sentence">Sentence</button><button data-a="part" title="Replay everything since the last question">Part</button></div><div class="cap" aria-live="off"></div></div>`);
  const v = $('video', box), cap = $('.cap', box), frame = $('.vid', box);
  if (!V) { cap.textContent = 'Video data is missing (data.js).'; return box; }
  let open = null;
  v.addEventListener('timeupdate', () => {
    const t = v.currentTime, ln = V.lines.find((l) => t >= l.start - 0.1 && t <= l.end + 0.5); cap.textContent = ln ? ln.text : '';
    if (open) return;
    const cue = (V.pauses || []).find((p) => !(S.quiz[p.id] && S.quiz[p.id].ok) && t >= p.t);
    if (cue) { v.pause(); if (t > cue.t + 0.4) v.currentTime = cue.t; ask(cue); }
  });
  v.addEventListener('play', () => { if (open) v.pause(); });
  v.addEventListener('ended', () => onEnd && onEnd());
  // replay: 10 seconds back, the current sentence, or everything since the last question
  const partStart = (t) => Math.max(0, ...(V.pauses || []).filter((p) => p.t < t - 1).map((p) => p.t));
  const jump = (to) => { if (open) { open.remove(); open = null; } v.currentTime = Math.max(0, to); v.play().catch(() => {}); };
  box.querySelectorAll('.vctl button').forEach((b) => { b.onclick = () => {
    const t = v.currentTime, ln = [...V.lines].reverse().find((l) => l.start <= t + 0.05) || V.lines[0];
    if (b.dataset.a === 'back') jump(t - 10);
    else if (b.dataset.a === 'line') jump((t - ln.start < 1.2 ? (V.lines[V.lines.indexOf(ln) - 1] || ln) : ln).start - 0.15);
    else jump(partStart(t));
  }; });
  setTimeout(() => { if (document.body.contains(v)) v.play().catch(() => {}); }, 300); // autoplay; the browser allows it once the visitor has clicked anything
  function ask(cue) {
    const q = QUIZ[cue.id]; const rec = S.quiz[cue.id] || (S.quiz[cue.id] = { tries: 0, ok: false });
    open = h(`<div class="quiz"><div class="q"><h3>YOUR GUESS FIRST</h3><div class="ask">${esc(q.ask)}</div><div class="opts"></div><div class="row"><button class="btn quiet" id="again">Not sure? Watch that part again</button></div><div class="why" hidden></div></div></div>`);
    $('#again', open).onclick = () => jump(Math.max(partStart(cue.t), cue.t - 40));
    q.opts.forEach((o, i) => {
      const b = h(`<button class="opt">${esc(o)}</button>`);
      b.onclick = () => {
        if (rec.ok) return; rec.tries++;
        if (i === q.right) {
          rec.ok = true; b.classList.add('right'); const pts = rec.tries === 1 ? 20 : 5; gain(pts);
          const w = $('.why', open); w.hidden = false; w.innerHTML = `<b>Yes. +${pts} XP.</b> ${esc(q.why)}<div class="row"><button class="btn go">Keep watching</button></div>`;
          $('.btn', w).onclick = () => { open.remove(); open = null; v.play(); }; $('.btn', w).focus();
        } else { b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); save(); }
      };
      $('.opts', open).append(b);
    });
    if (window.innerWidth < 700) { open.classList.add('below'); frame.after(open); open.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } else frame.append(open);
    $('.opt', open).focus({ preventScroll: true });
  }
  return box;
}

function lesson(st) {
  const m = $('#main'); m.innerHTML = '';
  const c = h(`<section class="card"><h2>${st.label}: ${st.name}</h2><p>${st.intro}</p></section>`);
  const tail = h('<div class="row"></div>'), keys = h('<div class="keys" hidden></div>');
  const done = () => { if (!S.done[st.id]) { S.done[st.id] = true; gain(30); drawTrail(); } tail.innerHTML = ''; tail.append(h('<b>Done.</b>'), nextBtn(st)); if (NOTES[st.id]) { keys.innerHTML = NOTES[st.id]; keys.hidden = false; } };
  c.append(player(st.video, done), tail, keys); if (S.done[st.id]) done(); m.append(c);
}

function solution(st) {
  const m = $('#main'); m.innerHTML = '';
  const c = h(`<section class="card"><h2>${st.label}: ${st.name}</h2><p>First the idea, then every line of the code, acted out. The video stops once to ask you about the loop test.</p></section>`);
  const tail = h('<div class="row"></div>'), more = h('<div></div>');
  const done = () => { if (!S.done[st.id]) { S.done[st.id] = true; gain(30); drawTrail(); } tail.innerHTML = ''; tail.append(h('<b>Done.</b>'), nextBtn(st)); };
  const back = h('<div class="row" style="margin:0 0 12px"><button class="btn quiet">← Back to the puzzle</button><span class="sub">YOUR CODE IS SAVED</span></div>');
  $('button', back).onclick = () => go('p1');
  c.append(back, player(st.video, done), tail, more); if (S.done[st.id]) done(); m.append(c);
  walk('p1', more);
  const mine = S.code.p1 && S.code.p1 !== PUZZLE.p1.start ? S.code.p1 : '';
  more.append(h(`<div class="keys"><h3>Step through it yourself</h3><p>Use Step above to move one line at a time. Before each click, say what will change: left, right, or the row.</p>
    ${mine ? `<h3>Your code</h3><pre class="mine">${esc(mine)}</pre><p style="margin-top:10px">Compare it with the standard solution. Different code that passes the tests is fine; check that you can say why yours stops.</p>` : ''}
    <h3>Say it in your own words</h3><p>Why does the loop use <code>left &lt; right</code> and not <code>left &lt;= right</code>? One or two sentences. Nobody grades this; writing it is the point.</p>
    <textarea id="why" style="min-height:90px" spellcheck="false"></textarea></div>`));
  const w = $('#why', more); w.value = S.why || ''; w.addEventListener('input', () => { S.why = w.value; save(); });
}

// ---------- sandbox: run the learner's code in a worker with a time limit ----------
const WORKER = `
const fmt = (v) => { try { return typeof v === 'string' ? v : JSON.stringify(v); } catch (e) { return String(v); } };
const build = (a) => { let head = null; for (let i = a.length - 1; i >= 0; i--) head = { value: a[i], next: head }; return head; };
self.onmessage = (ev) => {
  const { code, fn, tests, id } = ev.data; const logs = []; const out = [];
  console.log = (...a) => { if (logs.length < 40) logs.push(a.map(fmt).join(' ')); };
  let f;
  try { f = new Function(code + '\\n;return typeof ' + fn + ' === "function" ? ' + fn + ' : null;')(); } catch (e) { return postMessage({ error: String(e), logs }); }
  if (!f) return postMessage({ error: 'I could not find a function called ' + fn + '. Keep its name.', logs });
  for (const t of tests) {
    const want = t.slice().reverse(); let ok = false, got = '', msg = '';
    try {
      if (id === 'p1') {
        const row = t.slice(); const r = f(row); got = fmt(row); ok = fmt(row) === fmt(want);
        if (!ok && Array.isArray(r) && fmt(r) === fmt(want)) msg = 'You returned a reversed copy, but the row itself is unchanged. Swap inside the row.';
      } else {
        const head = build(t); const nodes = []; for (let n = head; n; n = n.next) nodes.push(n);
        let r = f(head); const vals = []; const seen = []; let guard = 0;
        while (r && guard++ <= t.length + 1) { vals.push(r.value); seen.push(r); r = r.next; }
        if (guard > t.length + 1) { got = 'a trail that never ends'; msg = 'Two signposts point at each other, so the trail loops forever.'; }
        else { got = vals.join(' → ') + (vals.length ? ' → ' : '') + 'null'; ok = fmt(vals) === fmt(want);
          if (ok && seen.some((n) => !nodes.includes(n))) { ok = false; msg = 'The order is right, but you made new stones. Turn the signposts on the stones you were given.'; }
          if (!ok && !msg && vals.length < t.length) msg = 'Part of the trail is missing. A signpost was turned before its old target was saved.'; }
      }
    } catch (e) { got = 'error: ' + (e && e.message || e); }
    out.push({ input: id === 'p1' ? fmt(t) : (t.join(' → ') + (t.length ? ' → ' : '') + 'null'), want: id === 'p1' ? fmt(want) : (want.join(' → ') + (want.length ? ' → ' : '') + 'null'), got, ok, msg });
  }
  postMessage({ out, logs });
};`;
function runCode(id, code) {
  return new Promise((res) => {
    const P = PUZZLE[id]; let w;
    try { w = new Worker(URL.createObjectURL(new Blob([WORKER], { type: 'text/javascript' }))); } catch (e) { return res({ error: 'This browser blocked the code runner. Open the page through the local server instead of the file.' }); }
    const kill = setTimeout(() => { w.terminate(); res({ error: 'Your code ran for over 2 seconds, so I stopped it. A loop probably never ends.' }); }, 2000);
    w.onmessage = (e) => { clearTimeout(kill); w.terminate(); res(e.data); };
    w.onerror = (e) => { clearTimeout(kill); w.terminate(); res({ error: e.message || 'The code could not start.' }); };
    w.postMessage({ code, fn: P.fn, tests: P.tests, id });
  });
}

function puzzle(st) {
  const id = st.id, P = PUZZLE[id], m = $('#main'); m.innerHTML = '';
  const review = S.solvedAt[id] && !S.seen['rev-' + id] && Date.now() - S.solvedAt[id] > 18 * 3600e3;
  const c = h(`<section class="card"><h2>${st.label}: ${P.title}</h2><div class="cols"><div class="l"></div><div class="r">
    <p>${P.ask}</p><pre class="spec">${esc(P.spec)}</pre>
    ${P.plan ? `<div class="plan"><b>Before you code, think it through</b><ol>${P.plan.map((t) => `<li>${esc(t)}</li>`).join('')}</ol><span>Stuck after that? The first hint is free.</span></div>` : ''}
    <label for="code-${id}" class="sub">YOUR CODE (JAVASCRIPT)</label>
    <textarea id="code-${id}" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    <div class="row"><button class="btn go" id="run">Run tests</button><button class="btn" id="hint">Hint</button><button class="btn quiet" id="reset">Start over</button><button class="btn quiet" id="show">Show me the solution</button></div>
    <div id="hints"></div><div id="res" aria-live="polite"></div></div></div><div id="walk"></div><div class="row" id="tail"></div></section>`);
  $('.l', c).append(player(st.video));
  const ta = $('textarea', c); ta.value = review ? P.start : (S.code[id] || P.start);
  if (review) $('.r', c).prepend(h('<div class="note"><b>Review day.</b> You solved this before. The editor is blank on purpose: solve it again from memory for double XP.</div>'));
  ta.addEventListener('input', () => { S.code[id] = ta.value; save(); });
  ta.addEventListener('keydown', (e) => { if (e.key === 'Tab') { e.preventDefault(); const a = ta.selectionStart; ta.setRangeText('  ', a, ta.selectionEnd, 'end'); S.code[id] = ta.value; } });
  const used = () => S.hints[id] || 0;
  const drawHints = () => { $('#hints', c).innerHTML = P.hints.slice(0, used()).map((t, i) => `<div class="hint"><b>Hint ${i + 1}.</b> ${esc(t)}</div>`).join(''); $('#hint', c).disabled = used() >= P.hints.length; $('#hint', c).textContent = used() >= P.hints.length ? 'No more hints' : (used() === 0 ? 'Hint (first one is free)' : `Hint (${P.hints.length - used()} left)`); };
  $('#hint', c).onclick = () => { S.hints[id] = used() + 1; save(); drawHints(); };
  $('#reset', c).onclick = () => { ta.value = P.start; S.code[id] = P.start; save(); $('#res', c).innerHTML = ''; ta.focus(); };
  $('#show', c).onclick = () => { S.seen['sol-' + id] = true; save(); go('s1'); };
  $('#run', c).onclick = async () => {
    const code = ta.value, res = $('#res', c); S.runs[id] = (S.runs[id] || 0) + 1; save();
    if (id === 'p1' && /\.\s*(reverse|toReversed)\s*\(/.test(code.replace(/\/\/.*$/gm, ''))) { res.innerHTML = '<div class="note warn">The built-in reverse would do it for you. Write the swaps yourself; that is the whole puzzle.</div>'; return; }
    res.innerHTML = '<div class="note">Running…</div>';
    const r = await runCode(id, code);
    if (r.error) { res.innerHTML = `<div class="note warn"><b>It did not run.</b> ${esc(r.error)}</div>`; return; }
    const all = r.out.every((t) => t.ok);
    res.innerHTML = `<ul class="tests">${r.out.map((t) => `<li class="${t.ok ? 'ok' : 'bad'}">${t.ok ? 'PASS' : 'FAIL'} &nbsp; ${esc(t.input)} &nbsp;→&nbsp; got ${esc(t.got)}${t.ok ? '' : ' &nbsp;· wanted ' + esc(t.want)}${t.msg ? '<br>' + esc(t.msg) : ''}</li>`).join('')}</ul>` +
      (r.logs.length ? `<pre class="spec" style="margin-top:10px">${esc(r.logs.join('\n'))}</pre>` : '');
    if (all) solved(); else if ((S.runs[id] || 0) >= 3 && used() === 0) res.append(h('<div class="note">Three tries in. A hint costs a little XP and saves a lot of time.</div>'));
  };
  function solved() {
    const first = !S.done[id]; let pts = 0;
    if (first) { pts = S.seen['sol-' + id] ? 40 : Math.max(40, 100 - 15 * Math.max(0, used() - 1)); S.done[id] = true; S.solvedAt[id] = Date.now(); }
    else if (review) { pts = 120; S.seen['rev-' + id] = true; }
    if (pts) gain(pts); drawTrail();
    $('#res', c).prepend(h(`<div class="note"><b>All tests pass.${pts ? ' +' + pts + ' XP.' : ''}</b> ${first ? 'Next, Pip and Moss walk through the standard solution line by line. Come back tomorrow: the editor will be blank and a second solve from memory is worth more.' : ''}</div>`));
    tail();
  }
  const tail = () => { const t = $('#tail', c); t.innerHTML = ''; if (S.done[id] || S.seen['sol-' + id]) t.append(nextBtn(st)); };
  drawHints(); tail(); m.append(c);
}

// ---------- walkthroughs: each step comes from really running the reference solution ----------
const PIP = '<svg width="46" height="50" viewBox="0 0 200 220"><g stroke="#2B1B4A" stroke-width="9" stroke-linejoin="round"><ellipse cx="98" cy="50" rx="14" ry="46" fill="#E24A3E" transform="rotate(-14 98 90)"/><ellipse cx="124" cy="48" rx="14" ry="48" fill="#FF6B5E" transform="rotate(4 124 90)"/><circle cx="26" cy="158" r="17" fill="#FFF6E0"/><ellipse cx="88" cy="160" rx="64" ry="50" fill="#FF6B5E"/><circle cx="130" cy="108" r="44" fill="#FF6B5E"/></g><circle cx="146" cy="100" r="9" fill="#2B1B4A"/></svg>';
const MOSS = '<svg width="56" height="40" viewBox="0 0 260 185"><g stroke="#2B1B4A" stroke-width="9" stroke-linejoin="round"><rect x="52" y="122" width="34" height="56" rx="15" fill="#9BE8D0"/><rect x="150" y="122" width="34" height="56" rx="15" fill="#9BE8D0"/><circle cx="222" cy="100" r="28" fill="#9BE8D0"/><path d="M18 134 A100 96 0 0 1 204 134 Z" fill="#12A594"/></g><circle cx="232" cy="92" r="8" fill="#2B1B4A"/></svg>';
function traceArray(input) {
  const row = input.slice(), ids = input.map((_, i) => i), steps = []; const snap = (line, say, hot = []) => steps.push({ row: row.slice(), ids: ids.slice(), left, right, line, say, hot });
  let left = 0, right = row.length - 1;
  snap(2, 'Pip takes the left end, Moss takes the right end.');
  while (left < right) {
    snap(3, `left (${left}) is still before right (${right}), so there is work to do.`);
    [row[left], row[right]] = [row[right], row[left]]; [ids[left], ids[right]] = [ids[right], ids[left]];
    snap(4, `Swap the parcels in doors ${left} and ${right}.`, [left, right]);
    left++; right--; snap(6, 'Both step toward the middle.');
  }
  snap(3, left === right ? 'They meet on the same door. The middle parcel is already in place, so they stop.' : 'They have passed each other. Every pair is swapped, so they stop.');
  return steps;
}
function traceList(input) {
  const next = input.map((_, i) => (i + 1 < input.length ? i + 1 : null)), steps = [];
  let prev = null, curr = input.length ? 0 : null, nx;
  const snap = (line, say, hot = null) => steps.push({ next: next.slice(), prev, curr, nx, line, say, hot });
  snap(2, 'prev starts as null: nothing is behind the head. curr starts on the head.');
  while (curr !== null) {
    nx = next[curr]; snap(4, `Save where stone ${input[curr]} points before touching it.`);
    next[curr] = prev; snap(5, `Turn stone ${input[curr]}'s signpost to point back at ${prev === null ? 'null' : 'stone ' + input[prev]}.`, curr);
    prev = curr; curr = nx; nx = undefined; snap(7, 'Step forward: prev moves to the stone just turned, curr moves to the saved stone.');
  }
  snap(9, `curr fell off the end. prev sits on stone ${input[prev]}: that is the new head.`);
  return steps;
}
function walk(id, host) {
  const input = id === 'p1' ? [1, 2, 3, 4, 5] : [1, 2, 3, 4], steps = id === 'p1' ? traceArray(input) : traceList(input); let i = 0, timer = null;
  host.innerHTML = '';
  const box = h(`<div><h2 style="margin-top:22px">The standard solution, step by step</h2><div class="cols"><div><div class="stage ${id === 'p2' ? 'meadow' : ''}"><div class="stage-in"></div></div><div class="say" aria-live="polite"></div>
    <div class="row"><button class="btn" id="prev">← Back</button><button class="btn go" id="nxt">Step →</button><button class="btn quiet" id="auto">Play</button><span class="sub" id="cnt"></span></div></div>
    <div class="codeview">${SOLUTION[id].map((l) => `<div>${esc(l) || ' '}</div>`).join('')}</div></div></div>`);
  host.append(box); const stage = $('.stage-in', box), W = id === 'p1' ? input.length * 84 : input.length * 120 + 150;
  stage.style.width = W + 'px'; stage.style.marginLeft = -W / 2 + 'px';
  const fit = () => { const s = Math.min(1.7, ($('.stage', box).clientWidth - 16) / W); stage.style.transform = `scale(${s})`; $('.stage', box).style.height = Math.round(250 * s) + 8 + 'px'; }; fit(); window.addEventListener('resize', fit);
  if (id === 'p1') {
    input.forEach((_, k) => stage.append(h(`<div class="cellx" style="left:${k * 84 + 5}px"></div>`), h(`<div class="ixx" style="left:${k * 84 + 5}px">${k}</div>`)));
    input.forEach((v, k) => stage.append(h(`<div class="valx" data-id="${k}">${v}</div>`)));
    stage.append(h(`<div class="ptr" id="pl">${PIP}<span>left</span></div>`), h(`<div class="ptr" id="pr">${MOSS}<span>right</span></div>`));
  }
  function draw() {
    const s = steps[i]; $('.say', box).textContent = s.say; $('#cnt', box).textContent = `STEP ${i + 1} OF ${steps.length}`;
    box.querySelectorAll('.codeview div').forEach((d, k) => d.classList.toggle('on', k === s.line));
    $('#prev', box).disabled = i === 0; $('#nxt', box).disabled = i === steps.length - 1;
    if (id === 'p1') {
      s.ids.forEach((vid, pos) => { const el = $(`.valx[data-id="${vid}"]`, stage); el.style.left = pos * 84 + 19 + 'px'; el.classList.toggle('hot', s.hot.includes(pos)); });
      $('#pl', stage).style.left = Math.max(0, Math.min(input.length - 1, s.left)) * 84 + 5 + 'px'; $('#pr', stage).style.left = Math.max(0, Math.min(input.length - 1, s.right)) * 84 + 5 + 'px';
      $('#pl', stage).style.top = s.left === s.right ? '14px' : '44px';
    } else {
      const X = (k) => 110 + k * 120, Y = 128, nullL = 30, nullR = X(input.length - 1) + 110;
      let g = `<svg width="${W}" height="250" style="position:absolute;left:0;top:0"><defs><marker id="m1" markerWidth="5" markerHeight="5" refX="3" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#2B1B4A"/></marker><marker id="m2" markerWidth="5" markerHeight="5" refX="3" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#E24A3E"/></marker></defs>`;
      s.next.forEach((to, k) => {
        // a turned signpost points left (drawn lower); only stone 0 can point at the left-hand null
        const turned = s.hot === k || (s.prev !== null && k <= s.prev);
        const left = to === null ? k === 0 && turned : to < k;
        const tx = to === null ? (left ? nullL + 34 : nullR - 34) : X(to) + (left ? 36 : -36), y = left ? Y + 12 : Y - 12, col = s.hot === k ? '#E24A3E' : '#2B1B4A';
        g += `<line x1="${X(k) + (left ? -34 : 34)}" y1="${y}" x2="${tx}" y2="${y}" stroke="${col}" stroke-width="6" stroke-linecap="round" marker-end="url(#${s.hot === k ? 'm2' : 'm1'})"/>`;
      });
      input.forEach((v, k) => { g += `<circle cx="${X(k)}" cy="${Y}" r="30" fill="${s.hot === k ? '#FF6B5E' : '#FFF6E0'}" stroke="#2B1B4A" stroke-width="5"/><text x="${X(k)}" y="${Y + 8}" text-anchor="middle" font-family="Outfit,sans-serif" font-weight="800" font-size="24" fill="#2B1B4A">${v}</text>`; });
      for (const nx of [nullL, nullR]) g += `<text x="${nx}" y="${Y + 5}" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="700" font-size="14" fill="#2B1B4A">null</text>`;
      g += '</svg>';
      const pos = (v, side) => (v === null ? (side === 'prev' ? nullL : nullR) : X(v));
      const tag = (name, v, top) => (v === undefined ? '' : `<div class="tag" style="left:${pos(v, name) - 24}px;top:${top}px">${name}</div>`);
      stage.innerHTML = g + tag('prev', s.prev, 60) + tag('curr', s.curr, 34) + tag('next', s.nx, 180);
    }
  }
  const stop = () => { clearInterval(timer); timer = null; $('#auto', box).textContent = 'Play'; };
  $('#prev', box).onclick = () => { stop(); i = Math.max(0, i - 1); draw(); };
  $('#nxt', box).onclick = () => { stop(); i = Math.min(steps.length - 1, i + 1); draw(); };
  $('#auto', box).onclick = () => { if (timer) return stop(); if (i === steps.length - 1) i = 0; draw(); $('#auto', box).textContent = 'Pause'; timer = setInterval(() => { if (i >= steps.length - 1) return stop(); i++; draw(); }, 1700); };
  draw();
}

// ---------- the answer to "did this format work for me?" ----------
function finish() {
  const m = $('#main'); m.innerHTML = ''; S.at = 'end'; save(); drawTrail();
  const qs = Object.values(S.quiz), first = qs.filter((q) => q.ok && q.tries === 1).length;
  const c = h(`<section class="card"><h2>Arrays chapter complete</h2><p>These numbers are the evidence. If the format works, you guessed most pauses right and solved the puzzles with few hints.</p>
  <div class="sum"><div><b>${first} / 6</b>pauses guessed right first time</div><div><b>${S.runs.p1 || 0}</b>test runs on the puzzle (${S.hints.p1 || 0} hints${S.seen['sol-p1'] ? ', saw solution first' : ''})</div><div><b>${S.xp}</b>XP</div></div>
  <p><b>Did it click?</b> Be honest; this decides whether to build more.</p><div class="row" id="feel"></div><div id="after"></div>
  <p style="margin-top:16px">The real test comes tomorrow: open the puzzle again. The editor will be blank. If you can rebuild the solution from memory, the format works for you.</p></section>`);
  [['yes', 'Yes, it clicked'], ['partly', 'Partly'], ['no', 'Not really']].forEach(([k, t]) => { const b = h(`<button class="btn ${S.feel === k ? 'go' : ''}">${t}</button>`); b.onclick = () => { S.feel = k; save(); finish(); }; $('#feel', c).append(b); });
  if (S.feel) $('#after', c).append(h(`<div class="note">Saved: “${S.feel}”. Tell Claude this answer plus the numbers above.</div>`));
  m.append(c);
}

save(); drawTrail(); S.at === 'end' ? finish() : go(STAGES.some((s, i) => s.id === S.at && unlocked(i)) ? S.at : 'w');
