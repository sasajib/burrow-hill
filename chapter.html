<title>Burrow Hill</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23FFC629'/%3E%3Cellipse cx='26' cy='21' rx='4.2' ry='10' transform='rotate(-12 26 21)' fill='%232B2620'/%3E%3Cellipse cx='38' cy='21' rx='4.2' ry='10' transform='rotate(12 38 21)' fill='%232B2620'/%3E%3Cpath d='M6 64C6 40 20 26 32 26s26 14 26 38z' fill='%23FFFAEC'/%3E%3Cpath d='M23 64V51a9 9 0 0 1 18 0v13z' fill='%232B2620'/%3E%3C/svg%3E">
<style>
/* layout: one column, a trail of four stops on top, one stage card below */
:root{--sky:#FFC83D;--sun:#FFD96B;--plum:#2B1B4A;--plum2:#45306E;--coral:#FF6B5E;--coralD:#E24A3E;--teal:#12A594;--mint:#9BE8D0;--cream:#FFF6E0;--meadow:#8FDDBD;
  --display:"Outfit",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--sky);color:var(--plum);font-family:var(--display);font-size:17px;line-height:1.45}
.wrap{max-width:min(1560px,94vw);margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-bottom:18px}
h1{font-size:34px;font-weight:800;letter-spacing:-1px;margin:0;line-height:1}
.sub{font-family:var(--mono);font-size:12px;letter-spacing:3px;font-weight:700}
.xp{margin-left:auto;font-family:var(--mono);font-weight:700;background:var(--plum);color:var(--cream);padding:8px 16px;border-radius:999px;font-variant-numeric:tabular-nums}
.trail{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
.stop{font:inherit;text-align:left;border:4px solid var(--plum);background:var(--cream);color:var(--plum);border-radius:16px;padding:10px 14px;cursor:pointer;box-shadow:4px 5px 0 var(--plum);min-width:0}
.stop small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:2px;font-weight:700}
.stop b{display:block;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop[aria-current="true"]{background:var(--coral)}
.stop.done{background:var(--mint)}
.stop[aria-current="true"],.stop.done[aria-current="true"]{background:var(--coral)}
.stop:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.stop:focus-visible,button:focus-visible,textarea:focus-visible{outline:4px solid var(--teal);outline-offset:2px}
.card{background:var(--cream);border:5px solid var(--plum);border-radius:22px;box-shadow:8px 10px 0 var(--plum);padding:20px;margin-bottom:22px}
h2{font-size:28px;font-weight:800;letter-spacing:-.5px;margin:0 0 6px;text-wrap:balance}
p{margin:0 0 12px;max-width:68ch}
.vid{position:relative;border:5px solid var(--plum);border-radius:16px;overflow:hidden;background:var(--plum);width:min(100%,calc(76vh * 16 / 9));margin-inline:auto}
.vid video{display:block;width:100%;height:auto;aspect-ratio:16/9}
.cap{text-align:center;font-family:var(--mono);font-size:15px;min-height:46px;padding:10px 4px 0;font-weight:500}
.quiz{position:absolute;inset:0;background:rgba(43,27,74,.88);display:flex;align-items:center;justify-content:center;padding:16px}
.quiz .q{background:var(--cream);border:5px solid var(--plum);border-radius:18px;padding:18px 20px;max-width:560px;width:100%;box-shadow:6px 8px 0 var(--coral);max-height:100%;overflow:auto}
.quiz h3{margin:0 0 4px;font-size:13px;font-family:var(--mono);letter-spacing:3px}
.quiz .ask{font-weight:700;font-size:20px;margin-bottom:12px}
.opts{display:grid;gap:8px}
button{font:inherit;cursor:pointer}
.opt,.btn{border:4px solid var(--plum);background:var(--cream);color:var(--plum);border-radius:12px;padding:9px 14px;font-weight:700;text-align:left}
.opt.right{background:var(--mint)} .opt.wrong{background:var(--coral);animation:shake .3s}
.btn{background:var(--sky);box-shadow:3px 4px 0 var(--plum);text-align:center}
.btn.go{background:var(--coral)} .btn.quiet{background:var(--cream);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.why{margin-top:10px;font-size:15px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}.trail{grid-template-columns:repeat(2,minmax(0,1fr))}}
textarea{width:100%;min-height:270px;font-family:var(--mono);font-size:14.500px;line-height:1.5;background:var(--plum);color:var(--cream);border:5px solid var(--plum);border-radius:14px;padding:14px;resize:vertical;tab-size:2}
pre,code{font-family:var(--mono);font-size:14px}
.spec{background:var(--sky);border:4px solid var(--plum);border-radius:12px;padding:10px 14px;font-family:var(--mono);font-size:14px;overflow-x:auto;margin:0 0 12px}
.tests{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px;font-family:var(--mono);font-size:13.500px}
.tests li{border:3px solid var(--plum);border-radius:10px;padding:6px 10px;overflow-wrap:anywhere}
.tests .ok{background:var(--mint)} .tests .bad{background:#FFC2BB}
.note{border-left:6px solid var(--teal);padding:6px 12px;background:#fff;border-radius:0 10px 10px 0;margin-top:10px;font-size:15px}
.note.warn{border-color:var(--coralD)}
.plan{background:#fff;border:4px solid var(--plum);border-radius:12px;padding:12px 16px;margin:0 0 14px;font-size:15.500px}
.plan b{display:block;font-size:17px;margin-bottom:4px}
.plan ol{margin:0 0 8px;padding-left:20px}
.plan li{margin-bottom:5px}
.plan span{font-family:var(--mono);font-size:12.500px;font-weight:700}
.vctl{display:flex;align-items:center;justify-content:center;margin-top:8px;font-family:var(--mono);font-weight:700;font-size:12.500px}
.vctl span{margin-right:10px;letter-spacing:2px;text-transform:uppercase}
.vctl button{font-family:var(--display);font-weight:700;font-size:14px;color:var(--plum);background:var(--cream);border:3px solid var(--plum);margin-left:-3px;padding:6px 16px;white-space:nowrap;min-height:38px}
.vctl button:first-of-type{border-radius:10px 0 0 10px;margin-left:0}
.vctl button:last-of-type{border-radius:0 10px 10px 0}
.vctl button:active{background:var(--sky)}
.stop .short,.stop .num{display:none}
#dq{max-width:860px}
.sol{margin-top:22px;border-top:5px solid var(--plum);padding-top:16px}
.vrow{position:absolute;height:60px}
.vc{position:absolute;width:56px;height:52px;line-height:44px;text-align:center;font-weight:800;font-size:24px;background:var(--cream);border:4px solid var(--plum);border-radius:9px;transition:background .25s}
.vc.hot{background:var(--sky)}.vc.ok{background:var(--mint)}.vc.bad{background:#FFC2BB}
.vi{position:absolute;width:56px;text-align:center;font-family:var(--mono);font-weight:700;font-size:12px}
.vp{position:absolute;font-family:var(--mono);font-size:12px;font-weight:700;background:var(--plum);color:var(--cream);border-radius:999px;padding:2px 9px;white-space:nowrap;transition:left .35s}
.vl{position:absolute;font-family:var(--mono);font-size:13px;font-weight:700}
.vbox{position:absolute;border:4px solid var(--plum);border-radius:12px;background:var(--cream);padding:6px 10px;font-family:var(--mono);font-weight:700;font-size:14px;line-height:1.7;min-width:120px}
.vbox b{display:block;font-family:var(--display);font-size:16px}
.vvar{display:inline-block;font-family:var(--mono);font-size:13px;font-weight:700;background:var(--plum);color:var(--cream);border-radius:999px;padding:3px 10px;margin:0 6px 6px 0}
.hint{background:var(--mint);border:3px solid var(--plum);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:15px}
/* walkthrough stage */
.stage{position:relative;height:250px;background:var(--sky);border:4px solid var(--plum);border-radius:14px;overflow:hidden;margin-top:12px}
.stage.meadow{background:var(--meadow)}
.stage-in{position:absolute;left:50%;top:0;height:100%;transform-origin:50% 0}
.cellx{position:absolute;top:130px;width:74px;height:74px;border:4px solid var(--plum);background:var(--plum);border-radius:37px 37px 0 0}
.ixx{position:absolute;top:210px;width:74px;text-align:center;font-family:var(--mono);font-weight:700;font-size:15px}
.valx{position:absolute;top:156px;width:46px;height:42px;line-height:34px;text-align:center;font-weight:800;font-size:20px;background:var(--cream);border:4px solid var(--plum);border-radius:8px;transition:left .45s cubic-bezier(.5,1.6,.5,1),top .45s}
.valx.hot{background:var(--coral)}
.ptr{position:absolute;top:44px;width:74px;text-align:center;transition:left .45s cubic-bezier(.5,1.4,.5,1)}
.ptr svg{display:block;margin:0 auto}
.ptr span,.tag{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:700;background:var(--plum);color:var(--cream);border-radius:999px;padding:2px 9px}
.tag{position:absolute;transition:left .4s,top .4s,opacity .2s}
.codeview{background:var(--plum);color:var(--cream);border-radius:14px;padding:12px 0;margin:12px 0 0;overflow-x:auto}
.codeview div{padding:0 14px;white-space:pre;font-family:var(--mono);font-size:13.500px;line-height:1.6}
.codeview .on{background:var(--coral);color:var(--plum);font-weight:700}
.say{font-weight:700;min-height:50px;margin-top:10px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.sum div{border:4px solid var(--plum);border-radius:12px;padding:10px 12px;background:#fff}
.seenbox{position:absolute;top:36px;width:150px;border:4px solid var(--plum);border-radius:12px;background:var(--cream);padding:6px 10px;font-family:var(--mono);font-weight:700;font-size:15px;line-height:1.7}
.seenbox b{display:block;font-family:var(--display);font-size:17px}
.seenbox .hit{background:var(--mint);border-radius:6px}
.sum b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.keys{margin-top:16px;border-top:4px solid var(--plum);padding-top:14px}
.keys h3{margin:0 0 8px;font-size:20px;font-weight:800}
.keys ul{margin:0 0 10px;padding-left:20px;max-width:70ch}
.keys li{margin-bottom:6px}
.keys table{border-collapse:collapse;font-family:var(--mono);font-size:14px;margin-top:6px}
.keys td{border:3px solid var(--plum);padding:6px 12px;background:#fff}
.keys td:first-child{font-weight:700;background:var(--mint)}
.keys td.slow{background:#FFC2BB}
.mine{background:var(--plum);color:var(--cream);border-radius:14px;padding:12px 14px;white-space:pre-wrap;overflow-x:auto;font-family:var(--mono);font-size:13.500px;line-height:1.6;margin:0}
/* phones: compact header, a slim five-step bar, clean video, questions under the video */
@media(max-width:700px){
  body{font-size:16px}
  .wrap{padding-block:12px 36px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  header{gap:4px 12px;margin-bottom:10px}
  h1{font-size:24px}
  .sub{font-size:10.500px;letter-spacing:2px}
  header nav{order:3;width:100%;margin-left:0!important;font-size:12px!important;gap:4px 14px!important}
  .xp{margin-left:auto!important;padding:5px 12px;font-size:13px}
  .trail{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-bottom:12px}
  .stop{padding:7px 2px 6px;border-width:3px;border-radius:10px;box-shadow:none;text-align:center}
  .stop b,.stop .full{display:none}
  .stop .short{display:block;font-size:10.500px;letter-spacing:0;white-space:nowrap}
  .stop .num{display:block;font-family:var(--display);font-weight:800;font-size:17px;line-height:1.1}
  .card{padding:12px;border-width:4px;border-radius:16px;box-shadow:4px 5px 0 var(--plum);margin-bottom:16px}
  h2{font-size:21px;margin-bottom:4px}
  p{font-size:15.500px;margin-bottom:10px}
  .vid{border-width:3px;border-radius:10px}
  .cap{font-size:13px;line-height:1.4;min-height:40px;padding:8px 2px 0;letter-spacing:0}
  .spec{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
  textarea{min-height:220px;font-size:13.500px;border-width:4px}
  .row .btn{padding:9px 14px}
  .quiz.below{position:static;background:none;padding:10px 0 0}
  .quiz.below .q{max-width:none;max-height:none;box-shadow:4px 5px 0 var(--coral);padding:14px}
  .quiz .ask{font-size:17px}
  .say{min-height:0}
  .plan{padding:10px 12px;font-size:14.500px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- own video player: full screen keeps the question on screen ---------- */
.vstage{position:relative;display:flex;flex-direction:column;min-width:0}
.vstage video{cursor:pointer}
.vbar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--plum);color:var(--cream);user-select:none;-webkit-user-select:none}
.vbar button{flex:none;min-width:40px;height:40px;border-radius:10px;border:0;background:rgba(255,246,224,.14);color:var(--cream);font-family:var(--mono);font-weight:700;font-size:14px;display:grid;place-items:center;padding:0 8px;cursor:pointer}
.vbar button:active{background:rgba(255,246,224,.3)}
.vbar svg{width:20px;height:20px;display:block}
.vtl{flex:1;height:28px;position:relative;cursor:pointer;touch-action:none;min-width:40px}
.vtl:before{content:"";position:absolute;left:0;right:0;top:11px;height:6px;border-radius:9px;background:rgba(255,246,224,.25)}
.vtl i{position:absolute;left:0;top:11px;height:6px;border-radius:9px;background:var(--sky);width:0}
.vtl b{position:absolute;top:6px;width:16px;height:16px;border-radius:50%;background:var(--coral);border:3px solid var(--cream);margin-left:-8px;left:0}
.vtl u{position:absolute;top:9px;width:4px;height:10px;border-radius:2px;background:var(--mint);margin-left:-2px}
.vtime{font-family:var(--mono);font-weight:700;font-size:12px;white-space:nowrap}
.vcapo{display:none}
.vid.fs{position:fixed;inset:0;z-index:9999;width:100vw;height:100vh;height:100dvh;max-width:none;margin:0;border:0;border-radius:0;background:#000;display:flex}
.vbar [data-v=cc]{display:none}
.vid.fs .vbar [data-v=cc]{display:grid}
.vid.fs.nocc .vbar [data-v=cc]{opacity:.45}
/* full screen: the video fills the screen; the controls and captions lie over it and the controls fade while it plays */
.vid.fs .vstage{flex:1 1 0;height:100%;background:#000;display:block;min-width:0}
.vid.fs video{position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;object-fit:contain;background:#000}
.vid.fs .vbar{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(20,10,40,.88) 45%);padding:24px 12px 8px;transition:opacity .25s}
.vid.fs.idle .vbar{opacity:0;pointer-events:none}
.vid.fs .vcapo{display:block;position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:min(94%,calc(100vh * 16 / 9 - 24px));bottom:66px;text-align:center;color:#fff;background:rgba(20,10,40,.72);padding:4px 12px;border-radius:10px;font-weight:600;line-height:1.25;font-size:clamp(13px,4vh,24px);pointer-events:none;transition:bottom .25s}
.vid.fs.idle .vcapo{bottom:10px}
.vid.fs .vcapo:empty,.vid.fs.nocc .vcapo,.vid.fs:has(.quiz) .vcapo{display:none}
.vid.fs .quiz{position:static;inset:auto;flex:0 0 42%;background:var(--cream);padding:8px;align-items:flex-start;overflow:auto;border-left:5px solid var(--plum)}
.vid.fs .quiz .q{border:0;box-shadow:none;padding:4px 6px 14px;max-width:none;max-height:none;overflow:visible}
.vid.fs .quiz h3{font-size:11px}
.vid.fs .quiz .ask{font-size:clamp(14px,4.4vh,22px);line-height:1.25;margin-bottom:8px}
.vid.fs .quiz .opts{gap:6px}
.vid.fs .quiz .opt,.vid.fs .quiz .btn{font-size:clamp(13px,4vh,19px);line-height:1.25;padding:6px 12px;min-height:40px}
@media (orientation:portrait){
  .vid.fs:not(.fake):has(.quiz){flex-direction:column}
  .vid.fs:not(.fake):has(.quiz) .vstage{flex:0 0 auto;height:auto;width:100%;aspect-ratio:16/9}
  .vid.fs:not(.fake) .quiz{flex:1 1 auto;border-left:0;border-top:5px solid var(--plum)}
  .vid.fs .vcapo{max-width:94%}
  /* iPhone has no real full screen for a page: turn the player on its side so the video fills the screen */
  .vid.fs.fake{width:100vh;width:100dvh;height:100vw;transform:rotate(90deg);transform-origin:top left;left:100vw;top:0;right:auto;bottom:auto}
}
body.vlock{overflow:hidden}
@media(max-width:480px){.vbar{gap:5px;padding:5px 6px}.vbar button{min-width:34px;height:36px;padding:0 5px;font-size:12.5px}.vbar svg{width:18px;height:18px}.vtime{font-size:11px}}
.spec{white-space:pre-wrap}

/* ================= friendly v2 skin (Doop canvas 42fbItqWJL): honey accent on a light page, soft cards ================= */
:root{--sky:#FFC629;--sun:#FFE08A;--plum:#2B2620;--plum2:#4A4238;--coral:#FFC629;--coralD:#D9482F;--teal:#2C8F62;--mint:#CDEBD8;--cream:#FFFAEC;--meadow:#DDF2E5;
  --line:#F0E4C4;--soft:#FFF0BF;--ink2:#6E6557;--deep:#E3A400;--leaf:#2C8F62;--berry:#D9482F;--display:"Nunito",system-ui,sans-serif;--head:"Fredoka","Nunito",system-ui,sans-serif}
body{background:var(--cream);font-weight:500}
b,strong{font-weight:800}
h1,h2,h3,.btn,.xp,.sub{font-family:var(--head)}
.wrap{max-width:min(1180px,94vw)}
header{flex-wrap:nowrap;gap:12px;margin-bottom:14px}
header .back{flex:none;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center}
header .lg{flex:none;display:block;line-height:0}
header .ttl{min-width:0}
h1{font-size:20px;font-weight:600;letter-spacing:-.2px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:11.5px;letter-spacing:.8px;font-weight:500;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{background:var(--soft);color:var(--plum);font-weight:600;padding:8px 14px;white-space:nowrap}
h2{font-weight:600;letter-spacing:-.2px}
/* steps: a slim bar, plus a list that opens */
.trail{display:flex!important;gap:5px;margin-bottom:8px}
.stop{flex:1;height:10px;padding:0;border:0;border-radius:99px;background:var(--line);box-shadow:none;position:relative;min-width:0}
.stop>*{display:none!important}
.stop:after{content:"";position:absolute;inset:-12px 0}
.stop.done{background:var(--leaf)}
.stop[aria-current="true"],.stop.done[aria-current="true"]{background:var(--sky);box-shadow:0 0 0 2px var(--deep)}
.stop:disabled{opacity:1}
.steps{margin-bottom:16px;font-size:14px;color:var(--ink2)}
.steps summary{display:flex;justify-content:space-between;gap:12px;cursor:pointer;list-style:none;padding:4px 0}
.steps summary::-webkit-details-marker{display:none}
.steps summary u{font-family:var(--head);font-weight:600;color:var(--plum);text-underline-offset:3px;white-space:nowrap}
#steplist{background:#fff;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--line);padding:6px;margin-top:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px}
.srow{display:flex;gap:10px;align-items:center;text-align:left;border:0;background:none;border-radius:12px;padding:9px 10px;color:var(--plum);font-size:15px;min-width:0}
.srow i{flex:none;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;color:#fff}
.srow.done i{background:var(--leaf);box-shadow:none}
.srow[aria-current="true"]{background:var(--soft)}.srow[aria-current="true"] i{background:var(--sky);box-shadow:none}
.srow span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.srow b{font-family:var(--head);font-weight:600}
.srow:disabled{opacity:.45;cursor:not-allowed}
.card{background:#fff;border:0;border-radius:24px;box-shadow:inset 0 0 0 1.5px var(--line);padding:22px}
.vid:not(.fs){border:0;border-radius:20px;box-shadow:0 10px 24px rgba(43,38,32,.16)}
.cap{font-family:var(--display);font-size:16px;font-weight:700;color:var(--plum)}
.vctl{gap:8px;font-family:var(--display);font-weight:500;font-size:14px;color:var(--ink2)}
.vctl span{margin-right:2px;letter-spacing:0;text-transform:none}
.vctl button,.vctl button:first-of-type,.vctl button:last-of-type{font-family:var(--head);font-weight:600;border:0;margin-left:0;border-radius:99px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line);padding:6px 14px}
.vctl button:active{background:var(--soft)}
.quiz{background:rgba(43,38,32,.78)}
.quiz .q,.quiz.below .q{background:var(--soft);border:0;border-radius:24px;box-shadow:none}
.quiz h3{font-family:var(--head);font-weight:600;letter-spacing:1.4px;color:var(--ink2)}
.quiz .ask{font-family:var(--head);font-weight:600;line-height:1.2}
.opt{border:0;background:#fff;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--line);padding:13px 16px;min-height:52px}
.opt.right{background:var(--meadow);box-shadow:inset 0 0 0 2px var(--leaf)}
.opt.wrong{background:#FBD9D2;box-shadow:inset 0 0 0 2px var(--berry)}
.btn{border:0;border-radius:99px;background:var(--sky);box-shadow:0 3px 0 var(--deep);font-weight:600;padding:11px 20px;color:var(--plum)}
.btn.go{background:var(--sky)}
.btn.quiet{background:#fff;box-shadow:inset 0 0 0 1.5px var(--line),0 3px 0 var(--line)}
.btn:disabled{box-shadow:none;background:var(--line);color:var(--ink2);opacity:1}
.vid.fs .quiz{background:var(--soft);border-left:0}
.vid.fs .quiz .btn{border-radius:16px}
textarea{border:0;border-radius:20px;padding:16px}
.spec{background:#fff;border:0;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--line)}
.exs{background:#fff;border-radius:16px;box-shadow:inset 0 0 0 1.5px var(--line);padding:4px 16px;margin:0 0 12px;font-family:var(--mono);font-size:14px}
.exs div{display:flex;justify-content:space-between;gap:14px;padding:9px 0;flex-wrap:wrap}.exs div+div{border-top:1.5px solid var(--line)}.exs b{font-weight:700;margin-left:auto;text-align:right}
.tests li{border:0;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--line);padding:8px 12px}
.tests .ok{background:var(--meadow)}.tests .bad{background:#FBD9D2}
.note{background:#FFF7DD;border-radius:0 12px 12px 0}
.plan{border:0;background:var(--soft);border-radius:16px;padding:14px 18px}
.plan b{font-family:var(--head);font-weight:600}.plan span{font-family:var(--display);font-size:13.5px;color:var(--ink2)}
.hint{border:0;border-radius:12px;background:var(--meadow)}
.sol,.keys{border-top:1.5px solid var(--line)}
.stage{border:0;box-shadow:inset 0 0 0 1.5px var(--line);background:var(--soft);border-radius:16px}
.stage.meadow{background:var(--meadow)}
.vc,.valx,.vbox,.seenbox{border-width:2px}
.sum div{border:0;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:16px}
.keys td{border:1.5px solid var(--line)}
.keys h3{font-weight:600}
a{color:var(--plum)}
@media(max-width:700px){
  .card{padding:16px;border-radius:20px;box-shadow:inset 0 0 0 1.5px var(--line)}
  h1{font-size:17px}
  .vid:not(.fs){border-radius:16px}
  .quiz.below .q{padding:16px}
  .acts{position:sticky;bottom:0;z-index:6;background:#fff;margin:12px -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -1.5px 0 var(--line);flex-wrap:nowrap}
  .acts .btn{flex:1;white-space:nowrap;padding:12px 10px;font-size:15px}
  .acts #run{flex:1.3}
}

/* ---------- interview mode (chapters with mock: true) ---------- */
.clock{display:inline-flex;align-items:center;gap:8px;font-family:var(--head);font-weight:600;font-size:15px;background:var(--soft);border-radius:99px;padding:6px 14px;margin:0 0 12px}
.clock b{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.clock.over{background:#FBD9D2}
.rep{width:100%;border-collapse:collapse;margin:14px 0;font-size:15px}
.rep th{font-family:var(--head);font-weight:600;font-size:13px;letter-spacing:.6px;color:var(--ink2);text-align:left;padding:6px 8px;border-bottom:1.5px solid var(--line)}
.rep td{padding:9px 8px;border-bottom:1.5px solid var(--line);vertical-align:top}
.rep td:first-child{font-weight:800}
.pill{display:inline-block;font-family:var(--head);font-weight:600;font-size:13px;border-radius:99px;padding:3px 10px;white-space:nowrap}
.pill.s{background:var(--meadow);color:#17603F}.pill.o{background:var(--soft)}.pill.w{background:#FBD9D2;color:#8E2A18}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:12px 0}
.two div{border-radius:16px;padding:14px 16px;background:var(--meadow)}.two div+div{background:#FFF0BF}
.two h3{margin:0 0 6px;font-size:17px}.two ul{margin:0;padding-left:18px}
@media(max-width:700px){.rep th:nth-child(4),.rep td:nth-child(4){display:none}.rep{font-size:14px}.rep th,.rep td{padding:8px 4px}.pill{white-space:normal;font-size:12px;padding:3px 8px}}
</style>

<body>
<div class="wrap">
<header>
  <a class="back" href="index.html#course" aria-label="All chapters" title="All chapters"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2B2620" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><a class="lg" href="index.html" title="Burrow Hill home"><svg viewBox="0 0 64 64" width="38" height="38" role="img" aria-label="Burrow Hill"><defs><clipPath id="bhc"><rect width="64" height="64" rx="18"/></clipPath></defs><g clip-path="url(#bhc)"><rect width="64" height="64" fill="#FFC629"/><ellipse cx="26" cy="21" rx="4.2" ry="10" transform="rotate(-12 26 21)" fill="#2B2620"/><ellipse cx="38" cy="21" rx="4.2" ry="10" transform="rotate(12 38 21)" fill="#2B2620"/><path d="M2 66C2 40 18 26 32 26s30 14 30 40z" fill="#FFFAEC"/><path d="M23 66V51a9 9 0 0 1 18 0v15z" fill="#2B2620"/></g></svg></a><div class="ttl"><h1 id="chtitle"></h1><div class="sub" id="chsub"></div></div>
  <div class="xp" id="xp" aria-live="polite">0 XP</div>
</header>
<nav class="trail" id="trail" aria-label="Stages"></nav>
<details class="steps" id="steps"><summary><span id="steplab"></span><u>All steps</u></summary><div id="steplist"></div></details>
<main id="main"></main>
</div>
<script src="data.js"></script>
<script>
// which chapter? chapter.html?c=strings
var CH_ID = (new URLSearchParams(location.search).get('c') || 'strings').replace(/[^a-z0-9_-]/gi, '');
document.write('<script src="chapters/' + CH_ID + '.js"><\/script>');
</script>
<script>
"use strict";
const D = window.BURROW || { videos: {} }, CH = window.CHAPTER;
const $ = (s, el = document) => el.querySelector(s);
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
if (!CH) { $('#main').innerHTML = '<section class="card"><h2>Chapter not found</h2><p>There is no chapter called "' + esc(CH_ID) + '".</p></section>'; throw new Error('no chapter'); }
document.title = 'Burrow Hill ' + CH.title; $('#chsub').textContent = CH.sub; $('#chtitle').textContent = CH.title;

// ---------- saved progress (this browser only) ----------
const KEY = CH.key;
let S = { xp: 0, done: {}, quiz: {}, code: {}, hints: {}, runs: {}, solvedAt: {}, seen: {}, at: CH.stages[0].id, feel: null, why: {} };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { S.ts = Date.now(); localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} $('#xp').textContent = S.xp + ' XP'; };
const gain = (n) => { S.xp += n; save(); };
const STAGES = [...CH.stages, ...CH.problems.map((p) => ({ id: p.id, kind: 'problem', label: 'Problem ' + p.num, short: 'P' + p.num, name: p.title, p }))];
const passed = (st) => S.done[st.id] || (st.kind === 'problem' && S.seen['sol-' + st.id]);
const unlocked = (i) => i === 0 || passed(STAGES[i - 1]);
const NOTES = CH.notes || {}, QUIZ = CH.quiz || {};

// ---------- trail ----------
// the line under the step bar, and the list of steps that opens from it
function drawSteps() {
  const safe = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const cur = Math.max(0, STAGES.findIndex((s) => s.id === S.at)), box = document.getElementById('steplist');
  document.getElementById('steplab').textContent = 'Step ' + (cur + 1) + ' of ' + STAGES.length + ' · ' + STAGES[cur].label;
  box.innerHTML = '';
  STAGES.forEach((st, i) => { const b = h(`<button class="srow ${S.done[st.id] ? 'done' : ''}" ${unlocked(i) ? '' : 'disabled'} aria-current="${S.at === st.id}"><i>${S.done[st.id] ? '✓' : ''}</i><span><b>${safe(st.label)}</b> · ${safe(st.name)}</span></button>`);
    b.onclick = () => { document.getElementById('steps').open = false; go(st.id); }; box.append(b); });
  const rs = h('<button class="srow" style="grid-column:1/-1;justify-content:center;text-decoration:underline;color:var(--ink2);font-size:14px">Start this chapter again (clears its progress)</button>');
  rs.onclick = () => { if (confirm('Clear your progress, code and XP for this chapter on this device? This cannot be undone.')) { try { localStorage.removeItem(KEY); } catch (e) {} location.href = location.pathname + location.search; } }; box.append(rs);
}
// examples "f(1) → 2      f(3) → 4" become one row each
function specHTML(spec) {
  const safe = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const parts = String(spec).split(/\n|\s{3,}/).map((s) => s.trim()).filter(Boolean);
  if (!parts.length || !parts.every((p) => p.includes('→') || /^\(.*\)$/.test(p))) return `<pre class="spec">${safe(spec)}</pre>`;
  return `<div class="exs">${parts.map((p) => { const k = p.indexOf('→'); return k < 0 ? `<div><span style="color:var(--ink2)">${safe(p)}</span></div>` : `<div><span>${safe(p.slice(0, k).trim())}</span><b>${safe(p.slice(k + 1).trim())}</b></div>`; }).join('')}</div>`;
}
function drawTrail() {
  const t = $('#trail'); t.innerHTML = ''; t.style.gridTemplateColumns = innerWidth > 700 ? `repeat(${Math.min(STAGES.length, 7)},minmax(0,1fr))` : '';
  STAGES.forEach((st, i) => {
    const b = h(`<button class="stop ${S.done[st.id] ? 'done' : ''}" ${unlocked(i) ? '' : 'disabled'} aria-current="${S.at === st.id}"><span class="num">${S.done[st.id] ? '✓' : i + 1}</span><small><span class="full">${st.label}${S.done[st.id] ? ' · DONE' : ''}</span><span class="short">${st.short || st.label}</span></small><b>${esc(st.name)}</b></button>`);
    b.onclick = () => go(st.id); t.append(b);
  });
  drawSteps();
}
function go(id) { S.at = id; save(); drawTrail(); const st = STAGES.find((s) => s.id === id) || STAGES[0]; ({ lesson, problem })[st.kind](st); window.scrollTo({ top: 0 }); }
function nextBtn(st) {
  const i = STAGES.indexOf(st), nx = STAGES[i + 1];
  const b = h(`<button class="btn go">${nx ? 'Next: ' + nx.label + ' →' : 'See how it went →'}</button>`);
  b.onclick = () => (nx ? go(nx.id) : finish()); return b;
}

// ---------- video with guess-first pauses and replay ----------
// ---------- own video controls. Full screen is the whole player (video + question), never the bare <video> ----------
function wirePlayer(v, frame, V) {
  const $$ = (s) => frame.querySelector(s), bPlay = $$('[data-v=play]'), tl = $$('.vtl'), fill = $$('.vtl i'), knob = $$('.vtl b'), time = $$('.vtime'), bSp = $$('[data-v=speed]'), bFs = $$('[data-v=fs]'), capo = $$('.vcapo');
  const PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4l14 8-14 8z" fill="currentColor"/></svg>', PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/></svg>';
  const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const api = { onChange: null, isFS: () => frame.classList.contains('fs') };
  const draw = () => { const d = v.duration || V.duration || 0, p = d ? Math.min(1, v.currentTime / d) : 0; fill.style.width = p * 100 + '%'; knob.style.left = p * 100 + '%'; time.textContent = fmt(v.currentTime) + ' / ' + fmt(d); bPlay.innerHTML = v.paused ? PLAY : PAUSE; };
  const marks = () => { const d = v.duration || V.duration || 0; if (!d || tl.dataset.m) return; tl.dataset.m = 1; (V.pauses || []).forEach((p) => { const u = document.createElement('u'); u.style.left = (p.t / d) * 100 + '%'; u.title = 'a question'; tl.insertBefore(u, knob); }); };
  ['timeupdate', 'play', 'pause', 'loadedmetadata', 'seeked'].forEach((e) => v.addEventListener(e, () => { marks(); draw(); if (capo) { const ln = V.lines.find((l) => v.currentTime >= l.start - 0.1 && v.currentTime <= l.end + 0.5); capo.textContent = ln ? ln.text : ''; } }));
  const toggle = () => { if (v.paused) v.play().catch(() => {}); else v.pause(); };
  // in full screen the controls fade while the video plays; the first tap brings them back, the next one pauses
  let idleT = 0; const wake = () => { frame.classList.remove('idle'); clearTimeout(idleT); if (api.isFS() && !v.paused) idleT = setTimeout(() => frame.classList.add('idle'), 2600); };
  ['pointermove', 'pointerdown', 'keydown'].forEach((n) => frame.addEventListener(n, (e) => { if (!(n === 'pointerdown' && e.target === v && frame.classList.contains('idle'))) wake(); }, true)); ['play', 'pause'].forEach((n) => v.addEventListener(n, wake));
  bPlay.onclick = toggle; v.addEventListener('click', () => { if (frame.classList.contains('idle')) wake(); else toggle(); });
  const bCc = $$('[data-v=cc]'); try { if (localStorage.getItem('burrow-cc') === '0') frame.classList.add('nocc'); } catch (e) {} bCc.onclick = () => { const off = frame.classList.toggle('nocc'); try { localStorage.setItem('burrow-cc', off ? '0' : '1'); } catch (e) {} };
  $$('[data-v=back]').onclick = () => { v.currentTime = Math.max(0, v.currentTime - 10); };
  const SP = [1, 1.25, 1.5, 0.75]; bSp.onclick = () => { const n = SP[(SP.indexOf(v.playbackRate) + 1) % SP.length]; v.playbackRate = n; bSp.textContent = n + '×'; };
  const seek = (e) => { const r = tl.getBoundingClientRect(), fake = frame.classList.contains('fake') && matchMedia('(orientation:portrait)').matches; const p = fake ? (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width; const d = v.duration || 0; if (d) v.currentTime = Math.max(0, Math.min(d - 0.05, p * d)); };
  let drag = false; tl.addEventListener('pointerdown', (e) => { drag = true; tl.setPointerCapture(e.pointerId); seek(e); }); tl.addEventListener('pointermove', (e) => { if (drag) seek(e); }); ['pointerup', 'pointercancel'].forEach((n) => tl.addEventListener(n, () => { drag = false; }));
  const set = (on, fake) => { frame.classList.toggle('fs', on); frame.classList.toggle('fake', on && !!fake); document.body.classList.toggle('vlock', on && !!fake); bFs.title = on ? 'Leave full screen' : 'Full screen'; wake(); if (api.onChange) api.onChange(); };
  api.enterFS = () => { const rq = frame.requestFullscreen || frame.webkitRequestFullscreen; if (rq) { try { const pr = rq.call(frame); if (pr && pr.then) pr.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => set(true, true)); } catch (e) { set(true, true); } } else set(true, true); };
  api.exitFS = () => { if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); try { screen.orientation.unlock(); } catch (e) {} } else set(false); };
  ['fullscreenchange', 'webkitfullscreenchange'].forEach((n) => document.addEventListener(n, () => { const el = document.fullscreenElement || document.webkitFullscreenElement; if (el === frame) set(true, false); else if (frame.classList.contains('fs') && !frame.classList.contains('fake')) set(false); }));
  bFs.onclick = () => (api.isFS() ? api.exitFS() : api.enterFS());
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && frame.classList.contains('fake')) set(false); });
  draw(); return api;
}
function player(vkey, onEnd) {
  const V = D.videos[vkey]; const box = h(`<div><div class="vid"><div class="vstage"><video playsinline disablepictureinpicture preload="metadata" src="${V ? V.src : ''}"></video><div class="vcapo" aria-hidden="true"></div><div class="vbar"><button data-v="play" title="Play or pause" aria-label="Play or pause"></button><button data-v="back" title="Back 10 seconds" aria-label="Back 10 seconds">−10</button><div class="vtl" role="slider" aria-label="Position in the video"><i></i><b></b></div><span class="vtime">0:00</span><button data-v="speed" title="Speed" aria-label="Speed">1×</button><button data-v="cc" title="Captions on or off" aria-label="Captions on or off">CC</button><button data-v="fs" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div></div><div class="vctl" role="group" aria-label="Replay"><span>Replay</span><button data-a="back" title="Go back 10 seconds">10 s</button><button data-a="line" title="Replay this sentence">Sentence</button><button data-a="part" title="Replay everything since the last question">Part</button></div><div class="cap" aria-live="off"></div></div>`);
  const v = $('video', box), cap = $('.cap', box), frame = $('.vid', box);
  if (!V) { cap.textContent = 'This video is not published yet.'; return box; }
  let open = null;
  const PL = wirePlayer(v, frame, V);
  const place = () => { if (!open) return; if (PL.isFS()) { open.classList.remove('below'); frame.append(open); } else if (window.innerWidth < 700) { open.classList.add('below'); frame.after(open); open.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } else { open.classList.remove('below'); frame.append(open); } };
  PL.onChange = place;
  v.addEventListener('timeupdate', () => {
    const t = v.currentTime, ln = V.lines.find((l) => t >= l.start - 0.1 && t <= l.end + 0.5); cap.textContent = ln ? ln.text : '';
    if (open) return;
    const cue = (V.pauses || []).find((p) => QUIZ[p.id] && !(S.quiz[p.id] && S.quiz[p.id].ok) && t >= p.t);
    if (cue) { v.pause(); if (t > cue.t + 0.4) v.currentTime = cue.t; ask(cue); }
  });
  v.addEventListener('play', () => { if (open) v.pause(); });
  // when the video ends, what comes next (the Done row with its button) is brought into view
  v.addEventListener('ended', () => { if (PL.isFS()) PL.exitFS(); if (!onEnd) return; onEnd(); requestAnimationFrame(() => { const sec = v.closest('section'); const row = sec && [...sec.querySelectorAll('.row')].find((r) => r.querySelector('button, a') && (v.compareDocumentPosition(r) & 4)); if (row) { const q = row.getBoundingClientRect(); if (q.bottom > innerHeight - 20 || q.top < 0) row.scrollIntoView({ behavior: 'smooth', block: 'center' }); } }); });
  setTimeout(() => { if (document.body.contains(v) && onEnd !== false) v.play().catch(() => {}); }, 300);
  const partStart = (t) => Math.max(0, ...(V.pauses || []).filter((p) => p.t < t - 1).map((p) => p.t));
  const jump = (to) => { if (open) { open.remove(); open = null; } v.currentTime = Math.max(0, to); v.play().catch(() => {}); };
  box.querySelectorAll('.vctl button').forEach((b) => { b.onclick = () => {
    const t = v.currentTime, ln = [...V.lines].reverse().find((l) => l.start <= t + 0.05) || V.lines[0];
    if (b.dataset.a === 'back') jump(t - 10);
    else if (b.dataset.a === 'line') jump((t - ln.start < 1.2 ? (V.lines[V.lines.indexOf(ln) - 1] || ln) : ln).start - 0.15);
    else jump(partStart(t));
  }; });
  function ask(cue) {
    const q = QUIZ[cue.id]; const rec = S.quiz[cue.id] || (S.quiz[cue.id] = { tries: 0, ok: false });
    open = h(`<div class="quiz"><div class="q"><h3>YOUR GUESS FIRST</h3><div class="ask">${esc(q.ask)}</div><div class="opts"></div><div class="row"><button class="btn quiet" id="again">Not sure? Watch that part again</button></div><div class="why" hidden></div></div></div>`);
    $('#again', open).onclick = () => jump(Math.max(partStart(cue.t), cue.t - 40));
    q.opts.forEach((o, i) => {
      const b = h(`<button class="opt">${esc(o)}</button>`);
      b.onclick = () => {
        if (rec.ok) return; rec.tries++;
        if (i === q.right) {
          rec.ok = true; b.classList.add('right'); const pts = rec.tries === 1 ? 20 : 5; gain(pts);
          const w = $('.why', open); w.hidden = false; w.innerHTML = `<b>Yes. +${pts} XP.</b> ${esc(q.why)}<div class="row"><button class="btn go">Keep watching</button></div>`;
          $('.btn', w).onclick = () => { open.remove(); open = null; v.play(); }; $('.btn', w).focus();
        } else { b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); save(); }
      };
      $('.opts', open).append(b);
    });
    place();
    $('.opt', open).focus({ preventScroll: true });
  }
  return box;
}

function lesson(st) {
  const m = $('#main'); m.innerHTML = '';
  const c = h(`<section class="card"><h2>${st.label}: ${esc(st.name)}</h2><p>${esc(st.intro || '')}</p></section>`);
  const tail = h('<div class="row"></div>'), keys = h('<div class="keys" hidden></div>');

      if (s.move) val['wc' + s.move[1]] = val['wc' + s.move[0]] ?? V.row[s.move[0]];
      for (const a of s.gone || []) gone['wc' + a] = 1; for (const a of s.show || []) delete gone['wc' + a];
      for (const [a, b] of Object.entries(s.set || {})) val[/^[a-z]/.test(a) ? 'w' + a : 'wc' + a] = b;
      for (const a of s.free || []) delete cls[typeof a === 'string' ? 'w' + a : 'wc' + a];
      for (const a of s.ok || []) cls[typeof a === 'string' ? 'w' + a : 'wc' + a] = 'ok'; for (const a of s.bad || []) cls[typeof a === 'string' ? 'w' + a : 'wc' + a] = 'bad'; }
    const s = steps[i]; const hot = new Set((s.hot || []).map((a) => (typeof a === 'string' ? 'w' + a : 'wc' + a)));
    stage.querySelectorAll('.vc').forEach((el) => { el.className = 'vc ' + (hot.has(el.id) ? 'hot' : (cls[el.id] || '')); if (val[el.id] !== undefined) el.textContent = val[el.id]; if (TR) el.style.opacity = gone[el.id] ? 0 : 1; if (GRD && el.style.background) el.className = 'vc'; });
    if (TR) stage.querySelectorAll('line').forEach((l) => { l.style.opacity = gone['wc' + l.id.slice(2)] ? 0 : 1; });
    V.ptrs.forEach((p, pk) => { const el = $('#wp-' + p.id, stage); if (ptr[p.id] === undefined) { el.style.opacity = 0; return; }
      if (TR) { const k = ptr[p.id], ok = thas(k), q = tpos(Math.max(0, k)); el.style.opacity = 1; el.textContent = ok ? p.id : p.id + ' = null'; const above = V.ptrs.filter((z, n) => n < pk && ptr[z.id] === k).length; el.style.transform = 'translateX(-50%)'; el.style.left = q.x + 'px'; el.style.top = (PK === 'grid' ? q.y + 12 : ok ? q.y + 28 : q.y - 10) + above * 18 + 'px'; if (PK === 'grid') { el.style.fontSize = '10px'; el.style.padding = '1px 6px'; el.style.zIndex = 3; } return; } const named = V.list || V.nameOnly, isNull = named && (ptr[p.id] < 0 || ptr[p.id] >= (p.row === 2 ? V.row2.length : n)); el.style.opacity = 1; el.textContent = named ? (isNull ? p.id + ' = null' : p.id) : p.id + ' = ' + ptr[p.id]; el.style.left = (isNull && ptr[p.id] < 0 ? X0 - LG - 50 : Math.min(ptr[p.id], p.row === 2 ? V.row2.length : n) * CW + X0) + 'px'; });
    if (V.list) stage.querySelectorAll('.va, svg, #wnulL').forEach((el) => { const id = el.id.slice(1); if (id in arr) el.style.opacity = arr[id]; else el.style.opacity = el.dataset.on0 ?? (el.dataset.on0 = el.style.opacity); });
    if (V.box) $('.vbox', stage).innerHTML = `<b>${esc(V.box.title)}</b>` + (bx && bx.length ? bx.map((t) => `<div>${esc(t)}</div>`).join('') : '<div>(empty)</div>');
    $('#vars', box).innerHTML = Object.entries(vars).map(([a, b]) => `<span class="vvar">${esc(a)} = ${esc(b)}</span>`).join('');
    $('.say', box).textContent = s.say; $('#cnt', box).textContent = `STEP ${i + 1} OF ${steps.length}`;
    box.querySelectorAll('.codeview div').forEach((d, k) => d.classList.toggle('on', k === s.line - 1));
    $('#prev', box).disabled = i === 0; $('#nxt', box).disabled = i === steps.length - 1;
  }
  const stop = () => { clearInterval(timer); timer = null; $('#auto', box).textContent = 'Play'; };
  $('#prev', box).onclick = () => { stop(); i = Math.max(0, i - 1); draw(); };
  $('#nxt', box).onclick = () => { stop(); i = Math.min(steps.length - 1, i + 1); draw(); };
  $('#auto', box).onclick = () => { if (timer) return stop(); if (i === steps.length - 1) i = 0; draw(); $('#auto', box).textContent = 'Pause'; timer = setInterval(() => { if (i >= steps.length - 1) return stop(); i++; draw(); }, 2200); };
  draw();
}

// interview mode: one row per puzzle, then what went well and what to practise, by topic
function mockReport() {
  const T = (CH.target || 20) * 60, fmtT = (n) => Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0'), strong = [], weak = [];
  const rows = CH.problems.map((p) => { const secs = (S.secs || {})[p.id] || 0, hints = S.hints[p.id] || 0, runs = S.runs[p.id] || 0, peek = (S.peek || {})[p.id], done = S.done[p.id];
    const grade = !done && !peek ? ['', 'not tried yet'] : peek || hints >= 2 ? ['w', 'needs work'] : hints === 1 || secs > T ? ['o', 'nearly there'] : ['s', 'strong'];
    const topic = p.topic ? `<a href="${p.topic.href}">${esc(p.topic.name)}</a>` : ''; if (grade[0] === 's' && topic) strong.push(topic); if (grade[0] === 'w' && topic) weak.push(topic);
    return `<tr><td>${esc(p.title)}</td><td>${grade[0] ? fmtT(secs) : ''}</td><td>${grade[0] ? hints + (peek ? ' + solution' : '') : ''}</td><td>${grade[0] ? runs : ''}</td><td>${grade[0] ? `<span class="pill ${grade[0]}">${grade[1]}</span>` : grade[1]}</td></tr>`; }).join('');
  const uniq = (a) => [...new Set(a)];
  return `<h3 style="margin:18px 0 0">Your interview report</h3><table class="rep"><tr><th>Puzzle</th><th>Time</th><th>Hints</th><th>Runs</th><th>Result</th></tr>${rows}</table>
  <div class="two"><div><h3>Your strengths</h3>${strong.length ? `<ul>${uniq(strong).map((t) => `<li>${t}</li>`).join('')}</ul>` : '<p style="margin:0">Solve a puzzle with no hints, inside the time, and its topic shows up here.</p>'}</div>
  <div><h3>Practise next</h3>${weak.length ? `<ul>${uniq(weak).map((t) => `<li>${t}</li>`).join('')}</ul>` : '<p style="margin:0">Nothing yet. Topics where you needed two hints or the solution show up here.</p>'}</div></div>
  <p class="sub" style="white-space:normal">Strong: no hints, inside ${CH.target || 20} minutes. Nearly there: one hint, or over time. Needs work: two hints or more, or the solution.</p>`;
}
function finish() {
  const m = $('#main'); m.innerHTML = ''; S.at = 'end'; save(); drawTrail();
  const ids = Object.keys(QUIZ), first = ids.filter((k) => S.quiz[k] && S.quiz[k].ok && S.quiz[k].tries === 1).length;
  const solved = CH.problems.filter((p) => S.done[p.id]).length, hints = CH.problems.reduce((a, p) => a + (S.hints[p.id] || 0), 0);
  const c = h(`<section class="card"><h2>${CH.mock ? 'Mock interviews: how it went' : esc(CH.title) + ': chapter complete'}</h2>
  <div class="sum"><div><b>${first} / ${ids.length}</b>video guesses right first time</div><div><b>${solved} / ${CH.problems.length}</b>problems solved</div><div><b>${hints}</b>hints used</div><div><b>${S.xp}</b>XP</div></div>
  ${CH.mock ? mockReport() : ''}<p>Come back tomorrow and solve the problems again from a blank editor. That second solve is what makes them stick.</p>
  <div class="row">${CH.next ? `<a class="btn go" href="${CH.next.href}" style="text-decoration:none">Continue: ${esc(CH.next.label)} →</a>` : ''}<a class="btn quiet" href="index.html#course" style="text-decoration:none">All chapters</a></div></section>`);
  m.append(c);
}

window.addEventListener('resize', () => { if (S.at !== 'end') drawTrail(); });
// a link can name a step: chapter.html?c=arrays#ar3 opens that puzzle if it is unlocked
const WANT = location.hash.slice(1), wantOk = STAGES.some((s, i) => s.id === WANT && unlocked(i));
save(); drawTrail(); S.at === 'end' && !wantOk ? finish() : go(wantOk ? WANT : STAGES.some((s, i) => s.id === S.at && unlocked(i)) ? S.at : STAGES[0].id);
