<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Burrow Hill</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* layout: one column, a trail of four stops on top, one stage card below */
:root{--sky:#FFC83D;--sun:#FFD96B;--plum:#2B1B4A;--plum2:#45306E;--coral:#FF6B5E;--coralD:#E24A3E;--teal:#12A594;--mint:#9BE8D0;--cream:#FFF6E0;--meadow:#8FDDBD;
  --display:"Outfit",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--sky);color:var(--plum);font-family:var(--display);font-size:17px;line-height:1.45}
.wrap{max-width:min(1560px,94vw);margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;margin-bottom:18px}
h1{font-size:34px;font-weight:800;letter-spacing:-1px;margin:0;line-height:1}
.sub{font-family:var(--mono);font-size:12px;letter-spacing:3px;font-weight:700}
.xp{margin-left:auto;font-family:var(--mono);font-weight:700;background:var(--plum);color:var(--cream);padding:8px 16px;border-radius:999px;font-variant-numeric:tabular-nums}
.trail{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:18px}
.stop{font:inherit;text-align:left;border:4px solid var(--plum);background:var(--cream);color:var(--plum);border-radius:16px;padding:10px 14px;cursor:pointer;box-shadow:4px 5px 0 var(--plum);min-width:0}
.stop small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:2px;font-weight:700}
.stop b{display:block;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop[aria-current="true"]{background:var(--coral)}
.stop.done{background:var(--mint)}
.stop[aria-current="true"],.stop.done[aria-current="true"]{background:var(--coral)}
.stop:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.stop:focus-visible,button:focus-visible,textarea:focus-visible{outline:4px solid var(--teal);outline-offset:2px}
.card{background:var(--cream);border:5px solid var(--plum);border-radius:22px;box-shadow:8px 10px 0 var(--plum);padding:20px;margin-bottom:22px}
h2{font-size:28px;font-weight:800;letter-spacing:-.5px;margin:0 0 6px;text-wrap:balance}
p{margin:0 0 12px;max-width:68ch}
.vid{position:relative;border:5px solid var(--plum);border-radius:16px;overflow:hidden;background:var(--plum);width:min(100%,calc(76vh * 16 / 9));margin-inline:auto}
.vid video{display:block;width:100%;height:auto;aspect-ratio:16/9}
.cap{text-align:center;font-family:var(--mono);font-size:15px;min-height:46px;padding:10px 4px 0;font-weight:500}
.quiz{position:absolute;inset:0;background:rgba(43,27,74,.88);display:flex;align-items:center;justify-content:center;padding:16px}
.quiz .q{background:var(--cream);border:5px solid var(--plum);border-radius:18px;padding:18px 20px;max-width:560px;width:100%;box-shadow:6px 8px 0 var(--coral);max-height:100%;overflow:auto}
.quiz h3{margin:0 0 4px;font-size:13px;font-family:var(--mono);letter-spacing:3px}
.quiz .ask{font-weight:700;font-size:20px;margin-bottom:12px}
.opts{display:grid;gap:8px}
button{font:inherit;cursor:pointer}
.opt,.btn{border:4px solid var(--plum);background:var(--cream);color:var(--plum);border-radius:12px;padding:9px 14px;font-weight:700;text-align:left}
.opt.right{background:var(--mint)} .opt.wrong{background:var(--coral);animation:shake .3s}
.btn{background:var(--sky);box-shadow:3px 4px 0 var(--plum);text-align:center}
.btn.go{background:var(--coral)} .btn.quiet{background:var(--cream);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.why{margin-top:10px;font-size:15px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}.trail{grid-template-columns:repeat(2,minmax(0,1fr))}}
textarea{width:100%;min-height:270px;font-family:var(--mono);font-size:14.500px;line-height:1.5;background:var(--plum);color:var(--cream);border:5px solid var(--plum);border-radius:14px;padding:14px;resize:vertical;tab-size:2}
pre,code{font-family:var(--mono);font-size:14px}
.spec{background:var(--sky);border:4px solid var(--plum);border-radius:12px;padding:10px 14px;font-family:var(--mono);font-size:14px;overflow-x:auto;margin:0 0 12px}
.tests{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px;font-family:var(--mono);font-size:13.500px}
.tests li{border:3px solid var(--plum);border-radius:10px;padding:6px 10px;overflow-wrap:anywhere}
.tests .ok{background:var(--mint)} .tests .bad{background:#FFC2BB}
.note{border-left:6px solid var(--teal);padding:6px 12px;background:#fff;border-radius:0 10px 10px 0;margin-top:10px;font-size:15px}
.note.warn{border-color:var(--coralD)}
.plan{background:#fff;border:4px solid var(--plum);border-radius:12px;padding:12px 16px;margin:0 0 14px;font-size:15.500px}
.plan b{display:block;font-size:17px;margin-bottom:4px}
.plan ol{margin:0 0 8px;padding-left:20px}
.plan li{margin-bottom:5px}
.plan span{font-family:var(--mono);font-size:12.500px;font-weight:700}
.vctl{display:flex;align-items:center;justify-content:center;margin-top:8px;font-family:var(--mono);font-weight:700;font-size:12.500px}
.vctl span{margin-right:10px;letter-spacing:2px;text-transform:uppercase}
.vctl button{font-family:var(--display);font-weight:700;font-size:14px;color:var(--plum);background:var(--cream);border:3px solid var(--plum);margin-left:-3px;padding:6px 16px;white-space:nowrap;min-height:38px}
.vctl button:first-of-type{border-radius:10px 0 0 10px;margin-left:0}
.vctl button:last-of-type{border-radius:0 10px 10px 0}
.vctl button:active{background:var(--sky)}
.stop .short,.stop .num{display:none}
#dq{max-width:860px}
.sol{margin-top:22px;border-top:5px solid var(--plum);padding-top:16px}
.vrow{position:absolute;height:60px}
.vc{position:absolute;width:56px;height:52px;line-height:44px;text-align:center;font-weight:800;font-size:24px;background:var(--cream);border:4px solid var(--plum);border-radius:9px;transition:background .25s}
.vc.hot{background:var(--sky)}.vc.ok{background:var(--mint)}.vc.bad{background:#FFC2BB}
.vi{position:absolute;width:56px;text-align:center;font-family:var(--mono);font-weight:700;font-size:12px}
.vp{position:absolute;font-family:var(--mono);font-size:12px;font-weight:700;background:var(--plum);color:var(--cream);border-radius:999px;padding:2px 9px;white-space:nowrap;transition:left .35s}
.vl{position:absolute;font-family:var(--mono);font-size:13px;font-weight:700}
.vbox{position:absolute;border:4px solid var(--plum);border-radius:12px;background:var(--cream);padding:6px 10px;font-family:var(--mono);font-weight:700;font-size:14px;line-height:1.7;min-width:120px}
.vbox b{display:block;font-family:var(--display);font-size:16px}
.vvar{display:inline-block;font-family:var(--mono);font-size:13px;font-weight:700;background:var(--plum);color:var(--cream);border-radius:999px;padding:3px 10px;margin:0 6px 6px 0}
.hint{background:var(--mint);border:3px solid var(--plum);border-radius:10px;padding:8px 12px;margin-top:8px;font-size:15px}
/* walkthrough stage */
.stage{position:relative;height:250px;background:var(--sky);border:4px solid var(--plum);border-radius:14px;overflow:hidden;margin-top:12px}
.stage.meadow{background:var(--meadow)}
.stage-in{position:absolute;left:50%;top:0;height:100%;transform-origin:50% 0}
.cellx{position:absolute;top:130px;width:74px;height:74px;border:4px solid var(--plum);background:var(--plum);border-radius:37px 37px 0 0}
.ixx{position:absolute;top:210px;width:74px;text-align:center;font-family:var(--mono);font-weight:700;font-size:15px}
.valx{position:absolute;top:156px;width:46px;height:42px;line-height:34px;text-align:center;font-weight:800;font-size:20px;background:var(--cream);border:4px solid var(--plum);border-radius:8px;transition:left .45s cubic-bezier(.5,1.6,.5,1),top .45s}
.valx.hot{background:var(--coral)}
.ptr{position:absolute;top:44px;width:74px;text-align:center;transition:left .45s cubic-bezier(.5,1.4,.5,1)}
.ptr svg{display:block;margin:0 auto}
.ptr span,.tag{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:700;background:var(--plum);color:var(--cream);border-radius:999px;padding:2px 9px}
.tag{position:absolute;transition:left .4s,top .4s,opacity .2s}
.codeview{background:var(--plum);color:var(--cream);border-radius:14px;padding:12px 0;margin:12px 0 0;overflow-x:auto}
.codeview div{padding:0 14px;white-space:pre;font-family:var(--mono);font-size:13.500px;line-height:1.6}
.codeview .on{background:var(--coral);color:var(--plum);font-weight:700}
.say{font-weight:700;min-height:50px;margin-top:10px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.sum div{border:4px solid var(--plum);border-radius:12px;padding:10px 12px;background:#fff}
.seenbox{position:absolute;top:36px;width:150px;border:4px solid var(--plum);border-radius:12px;background:var(--cream);padding:6px 10px;font-family:var(--mono);font-weight:700;font-size:15px;line-height:1.7}
.seenbox b{display:block;font-family:var(--display);font-size:17px}
.seenbox .hit{background:var(--mint);border-radius:6px}
.sum b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.keys{margin-top:16px;border-top:4px solid var(--plum);padding-top:14px}
.keys h3{margin:0 0 8px;font-size:20px;font-weight:800}
.keys ul{margin:0 0 10px;padding-left:20px;max-width:70ch}
.keys li{margin-bottom:6px}
.keys table{border-collapse:collapse;font-family:var(--mono);font-size:14px;margin-top:6px}
.keys td{border:3px solid var(--plum);padding:6px 12px;background:#fff}
.keys td:first-child{font-weight:700;background:var(--mint)}
.keys td.slow{background:#FFC2BB}
.mine{background:var(--plum);color:var(--cream);border-radius:14px;padding:12px 14px;white-space:pre-wrap;overflow-x:auto;font-family:var(--mono);font-size:13.500px;line-height:1.6;margin:0}
/* phones: compact header, a slim five-step bar, clean video, questions under the video */
@media(max-width:700px){
  body{font-size:16px}
  .wrap{padding-block:12px 36px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  header{gap:4px 12px;margin-bottom:10px}
  h1{font-size:24px}
  .sub{font-size:10.500px;letter-spacing:2px}
  header nav{order:3;width:100%;margin-left:0!important;font-size:12px!important;gap:4px 14px!important}
  .xp{margin-left:auto!important;padding:5px 12px;font-size:13px}
  .trail{grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-bottom:12px}
  .stop{padding:7px 2px 6px;border-width:3px;border-radius:10px;box-shadow:none;text-align:center}
  .stop b,.stop .full{display:none}
  .stop .short{display:block;font-size:10.500px;letter-spacing:0;white-space:nowrap}
  .stop .num{display:block;font-family:var(--display);font-weight:800;font-size:17px;line-height:1.1}
  .card{padding:12px;border-width:4px;border-radius:16px;box-shadow:4px 5px 0 var(--plum);margin-bottom:16px}
  h2{font-size:21px;margin-bottom:4px}
  p{font-size:15.500px;margin-bottom:10px}
  .vid{border-width:3px;border-radius:10px}
  .cap{font-size:13px;line-height:1.4;min-height:40px;padding:8px 2px 0;letter-spacing:0}
  .spec{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}
  textarea{min-height:220px;font-size:13.500px;border-width:4px}
  .row .btn{padding:9px 14px}
  .quiz.below{position:static;background:none;padding:10px 0 0}
  .quiz.below .q{max-width:none;max-height:none;box-shadow:4px 5px 0 var(--coral);padding:14px}
  .quiz .ask{font-size:17px}
  .say{min-height:0}
  .plan{padding:10px 12px;font-size:14.500px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><div class="sub" id="chsub"></div><h1><a href="index.html" title="Back to the home page" style="color:inherit;text-decoration:none">Burrow Hill</a></h1></div>
  <nav style="margin-left:auto;display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-weight:700;font-size:13px"><a href="index.html" style="color:var(--plum)">Home</a><a href="index.html#chapters" style="color:var(--plum)">All chapters</a></nav>
  <div class="xp" id="xp" aria-live="polite" style="margin-left:0">0 XP</div>
</header>
<nav class="trail" id="trail" aria-label="Stages"></nav>
<main id="main"></main>
</div>
<script src="data.js"></script>
<script>
// which chapter? chapter.html?c=strings
var CH_ID = (new URLSearchParams(location.search).get('c') || 'strings').replace(/[^a-z0-9_-]/gi, '');
document.write('<script src="chapters/' + CH_ID + '.js"><\/script>');
</script>
<script>
"use strict";
const D = window.BURROW || { videos: {} }, CH = window.CHAPTER;
const $ = (s, el = document) => el.querySelector(s);
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
if (!CH) { $('#main').innerHTML = '<section class="card"><h2>Chapter not found</h2><p>There is no chapter called "' + esc(CH_ID) + '".</p></section>'; throw new Error('no chapter'); }
document.title = 'Burrow Hill ' + CH.title; $('#chsub').textContent = CH.sub;

// ---------- saved progress (this browser only) ----------
const KEY = CH.key;
let S = { xp: 0, done: {}, quiz: {}, code: {}, hints: {}, runs: {}, solvedAt: {}, seen: {}, at: CH.stages[0].id, feel: null, why: {} };
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} $('#xp').textContent = S.xp + ' XP'; };
const gain = (n) => { S.xp += n; save(); };
const STAGES = [...CH.stages, ...CH.problems.map((p) => ({ id: p.id, kind: 'problem', label: 'Problem ' + p.num, short: 'P' + p.num, name: p.title, p }))];
const passed = (st) => S.done[st.id] || (st.kind === 'problem' && S.seen['sol-' + st.id]);
const unlocked = (i) => i === 0 || passed(STAGES[i - 1]);
const NOTES = CH.notes || {}, QUIZ = CH.quiz || {};

// ---------- trail ----------
function drawTrail() {
  const t = $('#trail'); t.innerHTML = ''; t.style.gridTemplateColumns = innerWidth > 700 ? `repeat(${Math.min(STAGES.length, 7)},minmax(0,1fr))` : '';
  STAGES.forEach((st, i) => {
    const b = h(`<button class="stop ${S.done[st.id] ? 'done' : ''}" ${unlocked(i) ? '' : 'disabled'} aria-current="${S.at === st.id}"><span class="num">${S.done[st.id] ? '✓' : i + 1}</span><small><span class="full">${st.label}${S.done[st.id] ? ' · DONE' : ''}</span><span class="short">${st.short || st.label}</span></small><b>${esc(st.name)}</b></button>`);
    b.onclick = () => go(st.id); t.append(b);
  });
}
function go(id) { S.at = id; save(); drawTrail(); const st = STAGES.find((s) => s.id === id) || STAGES[0]; ({ lesson, problem })[st.kind](st); window.scrollTo({ top: 0 }); }
function nextBtn(st) {
  const i = STAGES.indexOf(st), nx = STAGES[i + 1];
  const b = h(`<button class="btn go">${nx ? 'Next: ' + nx.label + ' →' : 'See how it went →'}</button>`);
  b.onclick = () => (nx ? go(nx.id) : finish()); return b;
}

// ---------- video with guess-first pauses and replay ----------
function player(vkey, onEnd) {
  const V = D.videos[vkey]; const box = h(`<div><div class="vid"><video controls playsinline preload="metadata" src="${V ? V.src : ''}"></video></div><div class="vctl" role="group" aria-label="Replay"><span>Replay</span><button data-a="back" title="Go back 10 seconds">10 s</button><button data-a="line" title="Replay this sentence">Sentence</button><button data-a="part" title="Replay everything since the last question">Part</button></div><div class="cap" aria-live="off"></div></div>`);
  const v = $('video', box), cap = $('.cap', box), frame = $('.vid', box);
  if (!V) { cap.textContent = 'This video is not published yet.'; return box; }
  let open = null;
  v.addEventListener('timeupdate', () => {
    const t = v.currentTime, ln = V.lines.find((l) => t >= l.start - 0.1 && t <= l.end + 0.5); cap.textContent = ln ? ln.text : '';
    if (open) return;
    const cue = (V.pauses || []).find((p) => QUIZ[p.id] && !(S.quiz[p.id] && S.quiz[p.id].ok) && t >= p.t);
    if (cue) { v.pause(); if (t > cue.t + 0.4) v.currentTime = cue.t; ask(cue); }
  });
  v.addEventListener('play', () => { if (open) v.pause(); });
  // when the video ends, what comes next (the Done row with its button) is brought into view
  v.addEventListener('ended', () => { if (!onEnd) return; onEnd(); requestAnimationFrame(() => { const sec = v.closest('section'); const row = sec && [...sec.querySelectorAll('.row')].find((r) => r.querySelector('button, a') && (v.compareDocumentPosition(r) & 4)); if (row) { const q = row.getBoundingClientRect(); if (q.bottom > innerHeight - 20 || q.top < 0) row.scrollIntoView({ behavior: 'smooth', block: 'center' }); } }); });
  setTimeout(() => { if (document.body.contains(v) && onEnd !== false) v.play().catch(() => {}); }, 300);
  const partStart = (t) => Math.max(0, ...(V.pauses || []).filter((p) => p.t < t - 1).map((p) => p.t));
  const jump = (to) => { if (open) { open.remove(); open = null; } v.currentTime = Math.max(0, to); v.play().catch(() => {}); };
  box.querySelectorAll('.vctl button').forEach((b) => { b.onclick = () => {
    const t = v.currentTime, ln = [...V.lines].reverse().find((l) => l.start <= t + 0.05) || V.lines[0];
    if (b.dataset.a === 'back') jump(t - 10);
    else if (b.dataset.a === 'line') jump((t - ln.start < 1.2 ? (V.lines[V.lines.indexOf(ln) - 1] || ln) : ln).start - 0.15);
    else jump(partStart(t));
  }; });
  function ask(cue) {
    const q = QUIZ[cue.id]; const rec = S.quiz[cue.id] || (S.quiz[cue.id] = { tries: 0, ok: false });
    open = h(`<div class="quiz"><div class="q"><h3>YOUR GUESS FIRST</h3><div class="ask">${esc(q.ask)}</div><div class="opts"></div><div class="row"><button class="btn quiet" id="again">Not sure? Watch that part again</button></div><div class="why" hidden></div></div></div>`);
    $('#again', open).onclick = () => jump(Math.max(partStart(cue.t), cue.t - 40));
    q.opts.forEach((o, i) => {
      const b = h(`<button class="opt">${esc(o)}</button>`);
      b.onclick = () => {
        if (rec.ok) return; rec.tries++;
        if (i === q.right) {
          rec.ok = true; b.classList.add('right'); const pts = rec.tries === 1 ? 20 : 5; gain(pts);
          const w = $('.why', open); w.hidden = false; w.innerHTML = `<b>Yes. +${pts} XP.</b> ${esc(q.why)}<div class="row"><button class="btn go">Keep watching</button></div>`;
          $('.btn', w).onclick = () => { open.remove(); open = null; v.play(); }; $('.btn', w).focus();
        } else { b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); save(); }
      };
      $('.opts', open).append(b);
    });
    if (window.innerWidth < 700) { open.classList.add('below'); frame.after(open); open.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } else frame.append(open);
    $('.opt', open).focus({ preventScroll: true });
  }
  return box;
}

function lesson(st) {
  const m = $('#main'); m.innerHTML = '';
  const c = h(`<section class="card"><h2>${st.label}: ${esc(st.name)}</h2><p>${esc(st.intro || '')}</p></section>`);
  const tail = h('<div class="row"></div>'), keys = h('<div class="keys" hidden></div>');
  const done = () => { if (!S.done[st.id]) { S.done[st.id] = true; gain(30); drawTrail(); } tail.innerHTML = ''; tail.append(h('<b>Done.</b>'), nextBtn(st)); if (NOTES[st.id]) { keys.innerHTML = NOTES[st.id]; keys.hidden = false; } };
  c.append(player(st.video, done), tail, keys); if (S.done[st.id]) done(); m.append(c);
}

// ---------- sandbox: run the learner's code in a worker with a time limit ----------
const WORKER = `
const fmt = (v) => { try { return typeof v === 'string' ? JSON.stringify(v) : JSON.stringify(v); } catch (e) { return String(v); } };
self.onmessage = (ev) => {

      if (TR) { const k = ptr[p.id], ok = thas(k), q = tpos(Math.max(0, k)); el.style.opacity = 1; el.textContent = ok ? p.id : p.id + ' = null'; const above = V.ptrs.filter((z, n) => n < pk && ptr[z.id] === k).length; el.style.transform = 'translateX(-50%)'; el.style.left = q.x + 'px'; el.style.top = (PK === 'grid' ? q.y + 12 : ok ? q.y + 28 : q.y - 10) + above * 18 + 'px'; if (PK === 'grid') { el.style.fontSize = '10px'; el.style.padding = '1px 6px'; el.style.zIndex = 3; } return; } const named = V.list || V.nameOnly, isNull = named && (ptr[p.id] < 0 || ptr[p.id] >= (p.row === 2 ? V.row2.length : n)); el.style.opacity = 1; el.textContent = named ? (isNull ? p.id + ' = null' : p.id) : p.id + ' = ' + ptr[p.id]; el.style.left = (isNull && ptr[p.id] < 0 ? X0 - LG - 50 : Math.min(ptr[p.id], p.row === 2 ? V.row2.length : n) * CW + X0) + 'px'; });
    if (V.list) stage.querySelectorAll('.va, svg, #wnulL').forEach((el) => { const id = el.id.slice(1); if (id in arr) el.style.opacity = arr[id]; else el.style.opacity = el.dataset.on0 ?? (el.dataset.on0 = el.style.opacity); });
    if (V.box) $('.vbox', stage).innerHTML = `<b>${esc(V.box.title)}</b>` + (bx && bx.length ? bx.map((t) => `<div>${esc(t)}</div>`).join('') : '<div>(empty)</div>');
    $('#vars', box).innerHTML = Object.entries(vars).map(([a, b]) => `<span class="vvar">${esc(a)} = ${esc(b)}</span>`).join('');
    $('.say', box).textContent = s.say; $('#cnt', box).textContent = `STEP ${i + 1} OF ${steps.length}`;
    box.querySelectorAll('.codeview div').forEach((d, k) => d.classList.toggle('on', k === s.line - 1));
    $('#prev', box).disabled = i === 0; $('#nxt', box).disabled = i === steps.length - 1;
  }
  const stop = () => { clearInterval(timer); timer = null; $('#auto', box).textContent = 'Play'; };
  $('#prev', box).onclick = () => { stop(); i = Math.max(0, i - 1); draw(); };
  $('#nxt', box).onclick = () => { stop(); i = Math.min(steps.length - 1, i + 1); draw(); };
  $('#auto', box).onclick = () => { if (timer) return stop(); if (i === steps.length - 1) i = 0; draw(); $('#auto', box).textContent = 'Pause'; timer = setInterval(() => { if (i >= steps.length - 1) return stop(); i++; draw(); }, 2200); };
  draw();
}

// ---------- end of chapter ----------
function finish() {
  const m = $('#main'); m.innerHTML = ''; S.at = 'end'; save(); drawTrail();
  const ids = Object.keys(QUIZ), first = ids.filter((k) => S.quiz[k] && S.quiz[k].ok && S.quiz[k].tries === 1).length;
  const solved = CH.problems.filter((p) => S.done[p.id]).length, hints = CH.problems.reduce((a, p) => a + (S.hints[p.id] || 0), 0);
  const c = h(`<section class="card"><h2>${esc(CH.title)}: chapter complete</h2>
  <div class="sum"><div><b>${first} / ${ids.length}</b>video guesses right first time</div><div><b>${solved} / ${CH.problems.length}</b>problems solved</div><div><b>${hints}</b>hints used</div><div><b>${S.xp}</b>XP</div></div>
  <p>Come back tomorrow and solve the problems again from a blank editor. That second solve is what makes them stick.</p>
  <div class="row">${CH.next ? `<a class="btn go" href="${CH.next.href}" style="text-decoration:none">Continue: ${esc(CH.next.label)} →</a>` : ''}<a class="btn quiet" href="index.html#chapters" style="text-decoration:none">All chapters</a></div></section>`);
  m.append(c);
}

window.addEventListener('resize', () => { if (S.at !== 'end') drawTrail(); });
save(); drawTrail(); S.at === 'end' ? finish() : go(STAGES.some((s, i) => s.id === S.at && unlocked(i)) ? S.at : STAGES[0].id);
</script>
